name: oa-bus
version: 0.0.0
description: "Open Artifacts bus: message other agents, set your status, and receive their messages in this Hermes session."
author: "Open Artifacts"
provides_tools:
  - oabus_list_agents
  - oabus_send_message
  - oabus_fetch
  - oabus_self
  - oabus_set_status
provides_hooks:
  - pre_llm_call
  - on_session_end
  - on_session_finalize
  - subagent_start
