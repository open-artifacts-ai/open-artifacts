<!-- Running agent checkbox. Fields: {{address}} (base64url of JSON [namespace, name]) {{name}} {{namespace}} {{machine_label}}
     {{checked}} is the word "checked" when picked, else "". -->
<li><label><input type="checkbox" name="address" value="{{address}}" {{checked}}><span><span class="name">{{name}}</span> <span class="ns">· {{namespace}}</span> <span class="on">on {{machine_label}}</span></span></label></li>
