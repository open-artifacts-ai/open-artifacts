<!-- Machine row, revoked. No action. Fields: {{label}} {{added}} {{last_used}} {{revoked_on}} (e.g. "Oct 30"). -->
<tr class="revoked">
  <td class="c-name name">{{label}}</td>
  <td class="c-added"><span class="k">Added </span>{{added}}</td>
  <td class="c-last"><span class="k">Last used </span>{{last_used}}</td>
  <td class="c-status"><span class="status s-revoked"><span class="dot"></span>Revoked {{revoked_on}}</span></td>
  <td class="c-action"></td>
</tr>
