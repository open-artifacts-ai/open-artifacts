      --oa-divider: #2c3037;
      --oa-border: #3b414a;
      --oa-border-strong: #676e78;
      --oa-text: #e9ebee;
      --oa-text-2: #b7bdc6;
      --oa-text-muted: #9097a1;
      --oa-accent: #7f9cff;
      --oa-accent-soft: #1f2a4a;

    color-scheme: dark;
    --oa-bg: #131518;
    --oa-surface: #1c1f23;
    --oa-surface-2: #212429;

  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--oa-bg);
    color: var(--oa-text);
    font-family: var(--oa-font-sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: 20px 16px;
  }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .kicker { margin: 0; font-family: var(--oa-font-mono); font-size: 13px; color: var(--oa-text-muted); }
  h1 { margin: 4px 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { margin: 8px 0 0; font-size: 14px; font-weight: 600; }

  /* The map: land is one dashed path (a round dot per grid cell), pins sit on top. */
  .map { margin: 0; padding: 12px; background: var(--oa-surface); border: 1px solid var(--oa-divider); border-radius: var(--oa-radius-lg); }
  .map svg { display: block; width: 100%; height: auto; overflow: visible; }
  .land { fill: none; stroke: var(--map-land); stroke-width: 0.62; stroke-linecap: round; stroke-dasharray: 0 1; }
  .pin { fill: var(--oa-accent); fill-opacity: 0.78; stroke: var(--oa-surface); stroke-width: 0.18; transform-box: fill-box; transform-origin: center; }
  .pin.me { fill-opacity: 1; stroke: var(--oa-text); stroke-width: 0.32; }
  .pin.pop { animation: pop 700ms var(--oa-ease); }
  @keyframes pop { 0% { transform: scale(0.2); } 55% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* Picker: an ARIA combobox over the built-in country list. */
  .picker { display: flex; gap: 8px; align-items: stretch; }
  .combo { position: relative; flex: 1 1 auto; min-width: 0; }
  .combo input {
    width: 100%;
    min-height: 44px;
    padding: 10px 36px 10px 12px;
    border: 1px solid var(--oa-border);
    border-radius: var(--oa-radius-lg);
    background: var(--oa-surface);
    color: var(--oa-text);
    font: inherit;
    font-size: 15px;
  }
  .combo input::placeholder { color: var(--oa-text-muted); }
  .combo input:hover { border-color: var(--oa-border-strong); }
  .combo input:focus-visible { outline: 2px solid var(--oa-focus); outline-offset: 1px; }
  .combo input:disabled { opacity: 0.6; }
  .caret { position: absolute; right: 12px; top: 50%; width: 10px; height: 10px; margin-top: -5px; pointer-events: none; fill: none; stroke: var(--oa-text-muted); stroke-width: 1.6; }
  .list {
    position: absolute;
    z-index: 5;
    left: 0; right: 0; top: calc(100% + 4px);
    max-height: 260px;
    overflow-y: auto;
    margin: 0; padding: 4px;
    list-style: none;
    background: var(--oa-surface);
    border: 1px solid var(--oa-border);
    border-radius: var(--oa-radius-lg);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
  }
  .list[hidden] { display: none; }
  .list li { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: var(--oa-radius); cursor: pointer; }
  .list li[aria-selected="true"] { background: var(--oa-accent-soft); }
  .list li.none { color: var(--oa-text-muted); cursor: default; }
  .flag { flex: none; width: 1.4em; text-align: center; }
  .btn {
    flex: none;
    min-height: 44px;
    padding: 0 20px;
    border: 1px solid var(--oa-accent);
    border-radius: var(--oa-radius-lg);
    background: var(--oa-accent);
    color: var(--oa-accent-text);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:focus-visible { outline: 2px solid var(--oa-focus); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .note { margin: 0; color: var(--oa-text-muted); font-size: 13px; text-wrap: pretty; font-variant-numeric: tabular-nums; }
  .note b { color: var(--oa-text); font-weight: 600; }
  .error { margin: 0; color: var(--oa-danger); font-size: 13px; }
  .error:empty { display: none; }

  .top { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .top li { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--oa-divider); font-size: 15px; }
  .top li:last-child { border-bottom: 0; }
  .top .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .top .you { color: var(--oa-text-muted); font-size: 13px; margin-left: 6px; }
  .top .meter { flex: 0 1 140px; height: 6px; border-radius: 3px; background: var(--oa-surface-2); overflow: hidden; }
  .top .meter span { display: block; height: 100%; background: var(--oa-accent); border-radius: 3px; transition: width 420ms var(--oa-ease); }
  .top .n { flex: none; min-width: 3ch; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .top .empty { color: var(--oa-text-muted); font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 480px) {
    .map { padding: 8px; }
    .top .meter { flex-basis: 72px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pin.pop { animation: none; }
    .top .meter span { transition: none; }
  }
  .demo-links { margin: 20px auto 0; text-align: center; font-size: 12.5px; }
  .demo-links a { color: var(--oa-text-muted); text-decoration: none; border-radius: 2px; }
  .demo-links a:hover { color: var(--oa-text-2); text-decoration: underline; text-underline-offset: 2px; }
  .demo-links a:focus-visible { outline: 2px solid var(--oa-focus); outline-offset: 2px; }

</head>

  function flag(code) { return String.fromCodePoint(...[...code].map((ch) => 0x1f1e6 + ch.charCodeAt(0) - 65)); }

  let me = null;             // { id, signedIn }
  let col = null;            // pins-YYYYMMDD
  let key = "";
  let unsub = null;
  let dayTimer = null;
  const pins = new Map();    // docId -> country code
  let mine = null;           // my code (optimistic)
  let pending = null;        // code waiting for the cooldown
  let inFlight = false;
  let lastWrite = 0;
  let timer = null;
  let readOnly = false;
  let ready = false;         // identity resolved, subscribed and the first load done
  let failText = "";         // why the map could not start, shown instead of "Connecting…"
  let closed = false;
  const popped = new Set();  // codes to animate on the next render

  const utcDay = (t = Date.now()) => new Date(t).toISOString().slice(0, 10).replace(/-/g, "");
  const dayIndex = (t = Date.now()) => Math.floor(t / 86400000);

  /* ---------- identity (as in the poll) ---------- */

  const safeId = (s) => String(s).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 100);
  function randomId() {
    const b = new Uint8Array(12);
    crypto.getRandomValues(b);
    return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
  }
  /** A per-browser id when storage works, else per tab. Used when viewer.anonId() has no id. */
  function localId() {
    for (const store of ["localStorage", "sessionStorage"]) {
      try {
        const s = window[store];
        let id = s.getItem("oa-demo-id");
        if (!id) { id = randomId(); s.setItem("oa-demo-id", id); }
        return id;
      } catch { /* sandboxed: try the next */ }
    }
    return randomId();
  }
  async function hash(s) {
    try {
      const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return Array.from(new Uint8Array(d).slice(0, 12), (x) => x.toString(16).padStart(2, "0")).join("");
    } catch {
      let h = 2166136261;
      for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
      return (h >>> 0).toString(16);
    }
  }
  async function identify() {
    let viewer = null;
    try { viewer = await OA.viewer.get(); } catch { viewer = null; }
    if (viewer && viewer.email) return { id: `u-${await hash(viewer.email)}`, signedIn: true };
    // viewer.anonId(), else the { anonId } that viewer.get() returns on servers before it.
    // Retried: a failed lookup (rate limited, offline) would leave a per-tab id, and a reload would lose a seat or a vote.
    let anon = null;
    for (let i = 0; i < 3; i += 1) {
      try {
        if (OA.viewer && typeof OA.viewer.anonId === "function") anon = await OA.viewer.anonId();
        break;
      } catch { await new Promise((r) => setTimeout(r, 1500 * (i + 1))); }
    }
    if (!anon && viewer && typeof viewer.anonId === "string") anon = viewer.anonId;
    if (anon && safeId(anon)) return { id: safeId(anon), signedIn: false };
    return { id: localId(), signedIn: false };
  }

  /** A pin counts only when c is a code from the built-in list. */
  function validPin(doc) {
    const c = doc && doc.data && doc.data.c;
    return typeof c === "string" && BY_CODE.has(c) ? c : null;
  }

  /* ---------- data ---------- */

  async function loadAll() {
    const next = new Map();
    let cursor;
    for (let i = 0; i < 100; i += 1) {
      const page = await col.list(cursor ? { cursor, limit: PAGE } : { limit: PAGE });
      for (const d of page.items) {
        const c = validPin(d);
        if (c !== null) next.set(d.id, c);
      }
      if (!page.nextCursor || page.items.length === 0) break;
      cursor = page.nextCursor;
    }
    pins.clear();
    for (const [k, v] of next) pins.set(k, v);
    syncMine();
  }
  function syncMine() {
    if (pending === null && !inFlight) mine = pins.has(me.id) ? pins.get(me.id) : null;
  }

  function applyChange(e) {
    if (e.resync) { loadAll().then(render, () => {}); return; }
    let latest = null;
    for (const d of e.docs) {
      const c = validPin(d);
      const was = pins.get(d.id);
      if (c === null) pins.delete(d.id); else pins.set(d.id, c);
      if (c !== null && c !== was) {
        popped.add(c);
        if (d.id !== me.id) latest = c;
      }
    }
    for (const id of e.deleted) pins.delete(id);
    syncMine();
    render();
    if (latest) say(`Someone picked ${BY_CODE.get(latest).name}.`);
  }

  async function openDay() {
    clearTimeout(dayTimer);
    if (unsub) unsub();
    pins.clear();
    mine = null;
    closed = false;
    key = `pins-${utcDay()}`;
    col = OA.db.collection(key);
    unsub = col.subscribe(applyChange);
    await loadAll();
    render();
    // A new collection at 00:00 UTC; nothing gets wiped.
    dayTimer = setTimeout(() => openDay().catch(() => fail()), (dayIndex() + 1) * 86400000 - Date.now() + 1000);
  }

  /* ---------- pinning ---------- */

  /** Every write carries me.id: never write without one. */
  const hasId = () => Boolean(me) && typeof me.id === "string" && me.id.length > 0;
  function pinCountry(code) {
    if (!ready) { hint(failText || "Still connecting, try again in a moment."); return; }
    if (readOnly || closed) { hint(el.error.textContent || "This map can't save pins."); return; }
    if (!hasId()) { hint("Can't tell who you are, so nothing was saved. Reload to try again."); return; }
    if (!BY_CODE.has(code)) return;
    if (code === mine && pending === null) { say(`Your pin is already ${BY_CODE.get(code).name}.`); return; }
    mine = code;
    pending = code;
    pins.set(me.id, code);
    popped.add(code);
    showError("");
    render();
    const wait = lastWrite + COOLDOWN_MS - Date.now();
    say(wait > 0 || inFlight ? `You picked ${BY_CODE.get(code).name}. Saving in a moment.` : `You picked ${BY_CODE.get(code).name}.`);
    flush();
  }
  function flush() {
    if (inFlight || pending === null || timer || !hasId()) return;
    const wait = lastWrite + COOLDOWN_MS - Date.now();
    if (wait > 0) { timer = setTimeout(() => { timer = null; flush(); }, wait); return; }
    const c = pending;
    pending = null;
    inFlight = true;
    lastWrite = Date.now();
    const target = col;
    target.set(me.id, { c })
      // Adopt the saved doc: your pin never waits on the live feed.
      .then((d) => {
        if (target !== col || !d || pending !== null) return;
        const saved = validPin(d);
        if (saved !== null) pins.set(d.id, saved);
      })
      .catch((err) => {
        if (target !== col) return;
        handleWriteError(err);
        // Roll back to what the server has, including your own pin.
        pins.delete(me.id);
        return loadAll().catch(() => {});
      })
      .finally(() => {
        inFlight = false;
        if (target === col) { syncMine(); render(); }
        flush();
      });
  }

  function handleWriteError(err) {
    const code = err && err.code;
    const msg = String((err && err.message) || "");
    pending = null;
    if ((code === "rate_limited" || code === "quota_exceeded") && /daily|day/i.test(msg)) {
      closed = true;
      showError("Pins are done for today. A fresh map opens at 00:00 UTC.");
    } else if (code === "rate_limited") showError("Your pin didn't save. Too many pins from your network. Try again in a minute.");
    else if (code === "unauthorized" || code === "data_editors_only") { readOnly = true; showError("This demo isn't accepting pins right now."); }
    else if (code === "capability_denied") { readOnly = true; showError("This map can't save pins."); }
    else showError("Your pin didn't save. Try again.");
  }

  /* ---------- combobox ---------- */

  let matches = [];
  let active = -1;
  let chosen = null;         // code picked in the combobox, not yet pinned

  function openList(q) {
    const f = fold(q.trim());
    matches = f ? COUNTRIES.filter((c) => c.key.includes(f)).sort((a, b) => rank(a, f) - rank(b, f)) : COUNTRIES.slice();
    active = matches.length && f ? 0 : -1;
    const frag = document.createDocumentFragment();
    matches.forEach((c, i) => {
      const li = document.createElement("li");
      li.id = `opt-${c.code}`;
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(i === active));
      li.innerHTML = '<span class="flag" aria-hidden="true"></span><span></span>';
      li.firstChild.textContent = flag(c.code);
      li.lastChild.textContent = c.name;
      li.addEventListener("mousedown", (e) => e.preventDefault());
      li.addEventListener("click", () => select(i));
      frag.append(li);
    });
    if (!matches.length) {
      const li = document.createElement("li");
      li.className = "none";
      li.textContent = "No country matches";
      frag.append(li);
    }
    el.list.replaceChildren(frag);
    el.list.hidden = false;
    el.input.setAttribute("aria-expanded", "true");
    setActive(active);
  }
  /** Names that start with the query first, then words that do, then the rest. */
  function rank(c, f) {
    const n = fold(c.name);
    return n.startsWith(f) ? 0 : (` ${c.key}`).includes(` ${f}`) ? 1 : 2;
  }
  function closeList() {
    el.list.hidden = true;
    el.input.setAttribute("aria-expanded", "false");
    el.input.removeAttribute("aria-activedescendant");
    active = -1;
  }
  function setActive(i) {
    const prev = el.list.querySelector('[aria-selected="true"]');
    if (prev) prev.setAttribute("aria-selected", "false");
    active = i;
    if (i < 0) { el.input.removeAttribute("aria-activedescendant"); return; }
    const li = el.list.children[i];
    li.setAttribute("aria-selected", "true");
    el.input.setAttribute("aria-activedescendant", li.id);
    li.scrollIntoView({ block: "nearest" });
  }
  function select(i) {
    const c = matches[i];
    if (!c) return;
    chosen = c.code;
    el.input.value = c.name;
    closeList();
    el.input.focus();
    renderControls();
  }
  /** What the Pin button would pin: the chosen option, or typed text that names exactly one country. */
  function resolveInput() {
    const f = fold(el.input.value.trim());
    if (!f) return null;
    if (chosen && fold(BY_CODE.get(chosen).name) === f) return chosen;
    const exact = COUNTRIES.find((c) => fold(c.name) === f || c.code.toLowerCase() === f);
    if (exact) return exact.code;
    const hits = COUNTRIES.filter((c) => c.key.includes(f));
    return hits.length === 1 ? hits[0].code : null;
  }

  function wireCombo() {
    el.input.addEventListener("input", () => { chosen = null; openList(el.input.value); renderControls(); });
    el.input.addEventListener("click", () => { if (el.list.hidden) openList(chosen ? "" : el.input.value); });
    el.input.addEventListener("blur", () => closeList());
    el.input.addEventListener("keydown", (e) => {
      const open = !el.list.hidden;
      switch (e.key) {
        case "ArrowDown":
          e.preventDefault();
          if (!open) { openList(chosen ? "" : el.input.value); if (!matches.length) return; setActive(chosen ? Math.max(0, matches.findIndex((c) => c.code === chosen)) : 0); return; }
          if (matches.length) setActive(Math.min(matches.length - 1, active + 1));
          return;
        case "ArrowUp":
          e.preventDefault();
          if (!open) { openList(chosen ? "" : el.input.value); if (matches.length) setActive(matches.length - 1); return; }
          if (matches.length) setActive(Math.max(0, active - 1));
          return;
        case "Enter":
          if (open && active >= 0) { e.preventDefault(); select(active); }
          return; // otherwise the form submits and pins
        case "Escape":
          if (open) { e.preventDefault(); closeList(); }
          else if (el.input.value) { e.preventDefault(); el.input.value = ""; chosen = null; renderControls(); }
          return;
        default:
      }
    });
    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      closeList();
      const code = resolveInput();
      if (!code) { showError("Pick a country from the list."); return; }
      chosen = code;
      el.input.value = BY_CODE.get(code).name;
      pinCountry(code);
    });
  }

  /* ---------- render ---------- */

  const SVGNS = "http://www.w3.org/2000/svg";
  function place(c) {
    const x = (c.lon + 180) / GRID.step - 0.5;
    const y = Math.min(GRID.rows - 0.5, Math.max(-0.5, (GRID.top - c.lat) / GRID.step - 0.5));
    return [x, y];
  }
  function tally() {
    const counts = new Map();
    for (const c of pins.values()) counts.set(c, (counts.get(c) || 0) + 1);
    return [...counts].sort((a, b) => b[1] - a[1] || BY_CODE.get(a[0]).name.localeCompare(BY_CODE.get(b[0]).name));
  }

  function renderMap(ranked) {
    const max = ranked.length ? ranked[0][1] : 1;
    const frag = document.createDocumentFragment();
    // Big circles first so small ones stay on top and visible.
    for (const [code, n] of ranked) {
      const c = BY_CODE.get(code);
      const [x, y] = place(c);
      const dot = document.createElementNS(SVGNS, "circle");
      dot.setAttribute("cx", x.toFixed(2));
      dot.setAttribute("cy", y.toFixed(2));
      dot.setAttribute("r", (0.62 + 1.7 * Math.sqrt(n / max)).toFixed(2));
      dot.setAttribute("class", `pin${code === mine ? " me" : ""}${popped.has(code) ? " pop" : ""}`);
      dot.dataset.code = code;
      const t = document.createElementNS(SVGNS, "title");
      t.textContent = `${c.name}: ${nf.format(n)}`;
      dot.append(t);
      frag.append(dot);
    }
    popped.clear();
    el.pins.replaceChildren(frag);
    const total = pins.size;
    el.mapLabel.textContent = total
      ? `World map of today's pins: ${nf.format(total)} ${total === 1 ? "pin" : "pins"} in ${nf.format(ranked.length)} ${ranked.length === 1 ? "country" : "countries"}. The list below has the counts.`
      : "World map of today's pins. No pins yet.";
  }

  function renderTop(ranked) {
    const max = ranked.length ? ranked[0][1] : 1;
    if (!ranked.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No pins yet today. Be the first.";
      el.top.replaceChildren(li);
      return;
    }
    el.top.replaceChildren(...ranked.slice(0, TOP_N).map(([code, n]) => {
      const c = BY_CODE.get(code);
      const li = document.createElement("li");
      li.innerHTML = '<span class="flag" aria-hidden="true"></span><span class="name"></span><span class="meter" aria-hidden="true"><span></span></span><span class="n"></span>';
      li.querySelector(".flag").textContent = flag(code);
      li.querySelector(".name").textContent = c.name;
      if (code === mine) {
        const you = document.createElement("span");
        you.className = "you";
        you.textContent = "(you)";
        li.querySelector(".name").append(you);
      }
      li.querySelector(".meter span").style.width = `${(n / max) * 100}%`;
      li.querySelector(".n").textContent = nf.format(n);
      li.querySelector(".n").setAttribute("aria-label", `${nf.format(n)} ${n === 1 ? "pin" : "pins"}`);
      return li;
    }));
  }

  function renderControls() {
    const off = readOnly || closed || !ready;
    el.input.disabled = off;
    el.pin.disabled = off;
    el.pin.textContent = mine && chosen === mine ? "Pinned" : mine ? "Move pin" : "Pin";
  }

  function render() {
    if (!ready) { renderControls(); el.note.textContent = failText || "Connecting…"; return; }
    const ranked = tally();
    renderMap(ranked);
    renderTop(ranked);
    renderControls();
    const total = pins.size;
    const head = `${nf.format(total)} ${total === 1 ? "pin" : "pins"} from ${nf.format(ranked.length)} ${ranked.length === 1 ? "country" : "countries"} today, one per browser.`;
    el.note.replaceChildren();
    if (mine) {
      const b = document.createElement("b");
      b.textContent = `${flag(mine)} ${BY_CODE.get(mine).name}`;
      el.note.append("Your pin: ", b, `. ${head}`);
    } else el.note.append(head);
    if (closed) el.note.append(" Done for today.");
    else if (!readOnly) el.note.append(mine ? " Change it any time." : "");
  }

  /* ---------- boot ---------- */

  function say(m) { el.announce.textContent = ""; requestAnimationFrame(() => { el.announce.textContent = m; }); }
  function showError(m) { el.error.textContent = m; }
  function fail(msg = "Could not reach the map. Reload to try again.") {
    failText = msg;
    el.note.textContent = msg;
  }
  let hintTimer = null;
  /** Says why a pin did nothing, on the note line and to screen readers, then goes back to the usual note. */
  function hint(msg) {
    render();
    el.note.textContent = msg;
    say(msg);
    clearTimeout(hintTimer);
    hintTimer = setTimeout(render, 4000);
  }

  async function boot() {
    wireCombo();
    if (!OA || !OA.db) {
      fail("Open this map from its view link to pin your country.");
      return;
    }
    await OA.ready;
    const setTheme = (t) => { document.documentElement.dataset.theme = t; };
    setTheme(OA.theme);
    OA.onTheme(setTheme);
    me = await identify();
    await openDay();
    ready = true;
    failText = "";
    render();
    // Timers sleep in background tabs: check the day again when the page comes back.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && col && `pins-${utcDay()}` !== key) openDay().catch(() => fail());
    });
  }
  setTimeout(() => { if (!ready && !failText) fail("Could not connect. Reload to try again."); }, 10000);
  boot().catch(() => fail());
})();
</script>
<script>
/* Links to the other demos. The publish script fills APP_ORIGIN and each id from
   ops/demo/ids.json; a link whose id is still a placeholder is never made. */
(() => {
  "use strict";
  const APP_ORIGIN = "{{origin}}";
  const IDS = { gallery: "{{id:gallery}}" };
  const resolved = (v) => typeof v === "string" && !v.startsWith("{" + "{");
  const VALID_ID = /^[A-Za-z0-9_-]{4,64}$/;
  function appOrigin() {
    if (resolved(APP_ORIGIN) && /^https?:\/\/[^/]+$/.test(APP_ORIGIN)) return APP_ORIGIN;
    try {
      const anc = window.location.ancestorOrigins;
      if (anc && anc.length && anc[anc.length - 1] !== "null") return anc[anc.length - 1];
    } catch {}
    return "";
  }
  const base = appOrigin();
  const LABELS = { gallery: "All demos", tictactoe: "Tic-tac-toe", chess: "Chess" };
  /* Links are built here, never in the markup, so an unfilled id leaves no link behind. */
  function link(slug, text) {
    const id = IDS[slug];
    if (!resolved(id) || !VALID_ID.test(id)) return null;
    const a = document.createElement("a");
    a.href = `${base}/a/${id}`;
    a.target = "_blank";
    a.rel = "noopener";
    a.dataset.demo = slug;
    a.textContent = text;
    if (slug === "gallery") a.insertAdjacentHTML("beforeend", '<span aria-hidden="true"> ↗</span>');
    a.insertAdjacentHTML("beforeend", '<span class="sr"> (opens in new tab)</span>');
    return a;
  }
  /* data-demo-link: the element's own text becomes the link. */
  for (const el of document.querySelectorAll("[data-demo-link]")) {
    const a = link(el.dataset.demoLink, el.textContent);
    if (a) el.replaceChildren(a);
  }
  /* data-demo-links: a hidden list of links, shown once at least one resolves. */
  for (const el of document.querySelectorAll("[data-demo-links]")) {
    for (const slug of el.dataset.demoLinks.split(" ")) {
      const a = link(slug, LABELS[slug]);
      if (a) el.append(a);
    }
    el.hidden = !el.children.length;
  }
})();
</script>
</body>
</html>
