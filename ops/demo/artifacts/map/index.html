<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Artifacts stargazers</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e4e1da;
    --accent: #d9822b; --ok: #2f8f5b; --warn: #b5541c;
  }
  :root[data-theme="dark"] {
    --bg: #141413; --panel: #1e1d1b; --ink: #ecebe6; --muted: #9c998f; --line: #34322e;
    --accent: #f0a04b; --ok: #5cc28a; --warn: #f08a5b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 24px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { text-decoration: underline; }
  .stats { display: flex; gap: 22px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 12px; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); }
  .dot.busy { animation: pulse 1.2s infinite; }
  .dot.warn { background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
    100% { box-shadow: 0 0 0 8px transparent; } }
  button { font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  #map { height: 100%; background: var(--bg); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px 18px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  aside h2:first-child { margin-top: 0; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 7px; font-size: 13px; }
  .bar i { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--accent); display: block; }
  .bar small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .person { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .person:first-of-type { border-top: 0; }
  .person img { width: 28px; height: 28px; border-radius: 50%; flex: none; }
  .person div { min-width: 0; }
  .person b { font-weight: 600; font-size: 13px; }
  .person span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person.nomap { cursor: default; }
  .note { color: var(--muted); font-size: 12px; }
  .pin { position: relative; }
  .pin i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel) center / cover no-repeat;
    box-shadow: 0 2px 6px rgba(0,0,0,.25); display: block; box-sizing: border-box; }
  .pin em { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    background: var(--accent); color: #fff; font: 600 11px/18px system-ui, sans-serif; text-align: center; font-style: normal; }
  .pin.new i { animation: pop 1.4s ease-out 3; }
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
  .leaflet-popup-content { margin: 10px 12px; }
  .pop h3 { margin: 0 0 6px; font-size: 13px; }
  .pop a { display: flex; gap: 8px; align-items: center; color: var(--ink); text-decoration: none; padding: 3px 0; }
  .pop a:hover b { text-decoration: underline; }
  .pop img { width: 22px; height: 22px; border-radius: 50%; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  :root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.5); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .live { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><a href="https://github.com/open-artifacts-ai/open-artifacts/stargazers" target="_blank" rel="noopener">Open Artifacts stargazers</a></h1>
    <div class="stats">
      <div class="stat"><b id="sStars">-</b><span>stars</span></div>
      <div class="stat"><b id="sMapped">-</b><span>on the map</span></div>
      <div class="stat"><b id="sCountries">-</b><span>countries</span></div>
    </div>
    <div class="live"><i class="dot" id="dot"></i><span id="liveText">Starting</span><button id="refresh" type="button">Check now</button></div>
  </header>
  <div id="map"></div>
  <aside>
    <h2>Countries</h2>
    <div id="countries"></div>
    <h2>Latest stars</h2>
    <div id="latest"></div>
    <p class="note" id="nomap"></p>
    <p class="note" data-demo-links="gallery" hidden></p>
    <p class="note">While this page is open it checks GitHub every 5 minutes for new stars and rechecks one profile for a moved location. What it finds is shared live with everyone viewing.</p>
  </aside>
</div>

","name":"David Broadfoot","avatar":"https://avatars.githubusercontent.com/u/449369?v=4","location":"Sydney","lat":-33.8698439,"lon":151.2082848,"place":"Sydney, New South Wales, Australia","country":"Australia","starredAt":"2026-11-09T23:30:59Z","checkedAt":"2026-11-10T18:57:57Z"},{"login":"jdgiles3","name":null,"avatar":"https://avatars.githubusercontent.com/u/198238051?v=4","location":null,"lat":null,"lon":null,"place":null,"country":null,"starredAt":"2026-11-09T23:55:52Z","checkedAt":"2026-11-10T18:57:57Z"},{"login":"netinlet","name":"Doug Bryant","avatar":"https://avatars.githubusercontent.com/u/4622?v=4","location":"Tulsa, OK","lat":36.1563122,"lon":-95.9927516,"place":"Tulsa, Oklahoma, United States","country":"United States","starredAt":"2026-11-10T00:11:24Z","checkedAt":"2026-11-10T18:57:57Z"},{"login":"devrsa","name":null,"avatar":"https://avatars.githubusercontent.com/u/72177264?v=4","location":null,"lat":null,"lon":null,"place":null,"country":null,"starredAt":"2026-11-10T03:08:32Z","checkedAt":"2026-11-10T18:57:57Z"},{"login":"DeluxeOwl","name":"Andrei Surugiu","avatar":"https://avatars.githubusercontent.com/u/54327698?v=4","location":null,"lat":null,"lon":null,"place":null,"country":null,"starredAt":"2026-11-10T08:42:45Z","checkedAt":"2026-11-10T18:57:57Z"},{"login":"itsApurba360","name":"Apurba Adhikary ⚡","avatar":"https://avatars.githubusercontent.com/u/181961589?v=4","location":null,"lat":null,"lon":null,"place":null,"country":null,"starredAt":"2026-11-10T10:08:08Z","checkedAt":"2026-11-10T18:57:57Z"},{"login":"gwbx","name":null,"avatar":"https://avatars.githubusercontent.com/u/9652899?v=4","location":"Paris","lat":48.8534951,"lon":2.3483915,"place":"Paris, Ile-de-France, Metropolitan France, France","country":"France","starredAt":"2026-11-10T10:46:27Z","checkedAt":"2026-11-10T18:57:57Z"}];
const REPO = "open-artifacts-ai/open-artifacts";
const POLL_MS = 5 * 60 * 1000;
const STALE_MS = 6 * 60 * 60 * 1000;
const RECHECK_PER_POLL = 1;
const JUNK = new Set(["location", "heart", "west coast", "earth", "internet", "remote", "worldwide", "planet earth", "localhost", "the internet"]);

const people = new Map();      // login -> record
let starLogins = new Set(SEED.map((p) => p.login)); // current stargazers: seed, then meta and the events feed
let starCount = SEED.length;
const fresh = new Set();
let coll = null, rateResetAt = 0, nextAt = 0, busy = false, offline = false;
let liveStars = null;


for (const p of SEED) people.set(p.login, p);

const LOGIN_RE = /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/;
/* Exactly GitHub's avatar URL shape: it goes into a CSS url(), so no quotes or other hosts. */
const AVATAR_RE = /^https:\/\/avatars\.githubusercontent\.com\/u\/\d{1,12}\?v=\d{1,3}$/;
const str = (v, n) => (typeof v === "string" && v.length <= n ? v : null);
const coord = (v, lim) => (typeof v === "number" && Number.isFinite(v) && Math.abs(v) <= lim ? v : null);
/* An ISO time no later than now, so a doc can't date itself into the future and dodge rechecks. */
const iso = (v) => (typeof v === "string" && /^\d{4}-\d{2}-\d{2}T[\d:.]+Z$/.test(v) && Date.parse(v) <= Date.now() + 60_000 ? v : null);
/* Live data is writable by any visitor, so a doc is only shown when it looks like a GitHub profile. */
function clean(d) {
  if (!d || typeof d !== "object" || typeof d.login !== "string" || !LOGIN_RE.test(d.login)) return null;
  if (typeof d.avatar !== "string" || !AVATAR_RE.test(d.avatar)) return null;
  const lat = coord(d.lat, 90), lon = coord(d.lon, 180);
  return { login: d.login, name: str(d.name, 100), avatar: d.avatar, location: str(d.location, 100),
    lat: lat !== null && lon !== null ? lat : null, lon: lat !== null && lon !== null ? lon : null,
    place: str(d.place, 200), country: str(d.country, 80), starredAt: iso(d.starredAt), checkedAt: iso(d.checkedAt) };
}
function adopt(raw) {
  const doc = clean(raw);
  if (!doc) return;
  // A saved profile is a stargazer: the events feed only reaches back about an hour, so saved
  // docs are what keeps older stars. Only editors' windows can save them (writes are editors-only).
  starLogins.add(doc.login); starCount = starLogins.size;
  const cur = people.get(doc.login);
  if (!cur || (doc.checkedAt || "") >= (cur.checkedAt || "")) people.set(doc.login, doc);
}

// ---------- map ----------
const map = L.map("map", { worldCopyJump: true, zoomControl: true }).setView([30, 0], 2);
L.tileLayer("https://tile.openstreetmap.de/{z}/{x}/{y}.png", {
  maxZoom: 18, crossOrigin: "anonymous",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
}).addTo(map);
function setTheme(t) { document.documentElement.dataset.theme = t; }
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const markers = L.layerGroup().addTo(map);
let fitted = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const country = (p) => p.country || (p.place ? p.place.split(",").pop().trim() : null);

function current() {
  const all = [...people.values()];
  return starLogins ? all.filter((p) => starLogins.has(p.login)) : all;
}

function render() {
  const list = current();
  const mapped = list.filter((p) => typeof p.lat === "number");
  const groups = new Map();
  for (const p of mapped) {
    const k = p.lat.toFixed(2) + "," + p.lon.toFixed(2);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  markers.clearLayers();
  const bounds = [];
  for (const g of groups.values()) {
    const p = g[0];
    const isNew = g.some((x) => fresh.has(x.login));
    const icon = L.divIcon({
      className: "", iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18],
      html: `<div class="pin${isNew ? " new" : ""}"><i style="background-image:url('${esc(p.avatar)}&s=68')"></i>${g.length > 1 ? `<em>${g.length}</em>` : ""}</div>`,
    });
    const html = `<div class="pop"><h3>${esc(p.place ? p.place.split(",").slice(0, 2).join(",") : p.location)}</h3>` +
      g.map((x) => `<a href="https://github.com/${esc(x.login)}" target="_blank" rel="noopener"><img src="${esc(x.avatar)}&s=44" alt=""><span><b>${esc(x.name || x.login)}</b><br><small>@${esc(x.login)}</small></span></a>`).join("") + "</div>";
    const m = L.marker([p.lat, p.lon], { icon }).bindPopup(html);
    m.addTo(markers);
    for (const x of g) x._marker = m;
    bounds.push([p.lat, p.lon]);
  }
  if (!fitted && bounds.length) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 4 }); fitted = true; }

  const counts = new Map();
  for (const p of mapped) { const c = country(p); if (c) counts.set(c, (counts.get(c) || 0) + 1); }
  const sorted = [...counts].sort((a, b) => b[1] - a[1]);
  const max = sorted[0]?.[1] || 1;
  document.getElementById("countries").innerHTML = sorted.map(([c, n]) =>
    `<div class="bar"><span>${esc(c)}</span><small>${n}</small><i style="width:${(n / max) * 100}%"></i></div>`).join("") || '<p class="note">None yet</p>';

  const latest = [...list].sort((a, b) => (b.starredAt || "").localeCompare(a.starredAt || "")).slice(0, 15);
  const box = document.getElementById("latest");
  box.innerHTML = latest.map((p) => `<div class="person${typeof p.lat === "number" ? "" : " nomap"}" data-login="${esc(p.login)}">
      <img src="${esc(p.avatar)}&s=56" alt=""><div><b>${esc(p.name || p.login)}</b><span>${esc(p.location || "No location")} · ${p.starredAt ? ago(p.starredAt) : ""}</span></div></div>`).join("");
  box.querySelectorAll(".person").forEach((el) => { el.onclick = () => {
    const p = people.get(el.dataset.login);
    if (p && p._marker) { map.setView(p._marker.getLatLng(), Math.max(map.getZoom(), 5)); p._marker.openPopup(); }
  }; });

  document.getElementById("sStars").textContent = liveStars ?? starCount;
  document.getElementById("sMapped").textContent = mapped.length;
  document.getElementById("sCountries").textContent = counts.size;
  const missing = list.length - mapped.length;
  const pending = liveStars != null ? liveStars - list.length : 0;
  document.getElementById("nomap").textContent = (missing ? `${missing} stargazers have no location we could place. ` : "") +
    (pending > 0 ? `${pending} new star${pending > 1 ? "s" : ""} will land on the map at the next refresh.` : "");
}

// ---------- status ----------
let lastChecked = null, statusMsg = null;
function status() {
  const dot = document.getElementById("dot"), t = document.getElementById("liveText");
  dot.className = "dot" + (busy ? " busy" : "") + (statusMsg || offline ? " warn" : "");
  if (busy) t.textContent = "Checking GitHub";
  else if (statusMsg) t.textContent = statusMsg;
  else if (offline) t.textContent = "Live updates paused. Reload to retry.";
  else if (lastChecked) {
    const left = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
    t.textContent = `Checked GitHub ${ago(lastChecked.toISOString())} · next in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  } else t.textContent = "Waiting";
  document.getElementById("refresh").disabled = busy;
}
setInterval(status, 1000);

// ---------- GitHub + geocoding ----------
async function gh(path, accept) {
  if (Date.now() < rateResetAt) throw new Error("rate");
  const r = await fetch("https://api.github.com/" + path, { headers: { Accept: accept || "application/vnd.github+json" } });
  const left = Number(r.headers.get("x-ratelimit-remaining"));
  if (r.status === 403 || r.status === 429 || left === 0) {
    rateResetAt = Number(r.headers.get("x-ratelimit-reset")) * 1000 || Date.now() + 15 * 60 * 1000;
    if (!r.ok) throw new Error("rate");
  }
  if (!r.ok) throw new Error("http " + r.status);
  return { body: await r.json(), left };
}

const geoCache = new Map();
for (const p of people.values()) if (p.location) geoCache.set(p.location.trim().toLowerCase(), p);
let lastGeo = 0;
async function geocode(loc) {
  const key = loc.trim().toLowerCase();
  if (JUNK.has(key)) return { lat: null, lon: null, place: null, country: null };
  const hit = geoCache.get(key);
  if (hit) return { lat: hit.lat ?? null, lon: hit.lon ?? null, place: hit.place ?? null, country: hit.country ?? null };
  const wait = lastGeo + 1100 - Date.now();
  if (wait > 0) await new Promise((r) => setTimeout(r, wait));
  lastGeo = Date.now();
  try {
    const r = await fetch("https://photon.komoot.io/api/?limit=1&lang=en&q=" + encodeURIComponent(loc));
    const j = await r.json();
    const f = j.features && j.features[0];
    const pr = f ? f.properties : null;
    const out = f ? { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], place: [pr.name, pr.state, pr.country].filter(Boolean).join(", "), country: pr.country || null }
      : { lat: null, lon: null, place: null, country: null };
    geoCache.set(key, out);
    return out;
  } catch { return { lat: null, lon: null, place: null, country: null }; }
}

/* Logins GitHub answered 404 for this session: never looked up again. */
const gone = new Set();
let firstPoll = true;

/* One profile; a failure other than the rate limit skips it instead of stopping the poll. */
async function tryLookup(login, starredAt) {
  try { return await lookup(login, starredAt); }
  catch (err) { if (err.message === "rate") throw err; console.warn("lookup failed", login, err); return null; }
}

async function lookup(login, starredAt) {
  let u;
  try { ({ body: u } = await gh("users/" + login)); }
  catch (err) {
    if (err.message !== "http 404") throw err;
    // No such account (deleted, or a made-up doc): drop it everywhere.
    gone.add(login); people.delete(login); starLogins.delete(login); starCount = starLogins.size;
    if (coll) { try { await coll.delete(login); } catch {} }
    return null;
  }
  const prev = people.get(login);
  const loc = (u.location || "").trim() || null;
  let geo = { lat: null, lon: null, place: null, country: null };
  if (loc) geo = prev && prev.location === loc ? prev : await geocode(loc);
  const rec = { login, name: u.name || null, avatar: u.avatar_url, location: loc, lat: geo.lat ?? null, lon: geo.lon ?? null,
    place: geo.place ?? null, country: geo.country ?? null, starredAt: starredAt || prev?.starredAt || null, checkedAt: new Date().toISOString() };
  people.set(login, rec);
  if (coll) { try { await coll.set(login, rec); } catch (e) { console.warn("save failed", e); } }
  return rec;
}

async function poll() {
  if (busy) return;
  busy = true; statusMsg = null; status();
  try {
    const { body } = await gh(`repos/${REPO}`);
    liveStars = body.stargazers_count;
    // New stars: GitHub's public events feed (the stargazer list itself needs sign-in).
    // The feed keeps the last 300 events: read all of it once per window, then the newest page.
    const events = [];
    for (let page = 1; page <= (firstPoll ? 3 : 1); page++) {
      const { body: batch } = await gh(`repos/${REPO}/events?per_page=100&page=${page}`);
      events.push(...batch);
      if (batch.length < 100) break;
    }
    firstPoll = false;
    for (const e of events.filter((x) => x.type === "WatchEvent").reverse()) {
      const login = e.actor.login;
      if (gone.has(login) || !LOGIN_RE.test(login)) continue;
      if (!starLogins.has(login)) { starLogins.add(login); starCount = starLogins.size; }
      if (!people.has(login)) { if (await tryLookup(login, e.created_at)) fresh.add(login); render(); }
    }
    // Moved locations: recheck the stalest profile.
    const stale = [...people.values()].filter((p) => (!starLogins || starLogins.has(p.login)) && Date.now() - new Date(p.checkedAt || 0) > STALE_MS)
      .sort((a, b) => (a.checkedAt || "").localeCompare(b.checkedAt || "")).slice(0, RECHECK_PER_POLL);
    for (const p of stale) await tryLookup(p.login, p.starredAt);
    lastChecked = new Date();
  } catch (e) {
    statusMsg = e.message === "rate"
      ? `GitHub rate limit hit; resuming ${new Date(rateResetAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`
      : "Couldn't reach GitHub; retrying";
  } finally {
    busy = false;
    nextAt = Date.now() + POLL_MS;
    render(); status();
  }
}

document.getElementById("refresh").onclick = poll;
setInterval(() => { if (!document.hidden && Date.now() >= nextAt) poll(); }, 15000);

// ---------- shared cache ----------
async function loadShared() {
  let cursor, pages = 0;
  do {
    const r = await coll.list({ cursor, limit: 100 });
    for (const d of r.items) adopt(d.data);
    cursor = r.nextCursor || null;
  } while (cursor && ++pages < 20);
}

(async () => {
  render();
  try {
    if (window.openArtifacts) {
      await openArtifacts.ready;
      setTheme(openArtifacts.theme || "light");
      openArtifacts.onTheme && openArtifacts.onTheme(setTheme);
      coll = openArtifacts.db.collection("people");
      await loadShared();
      render();
      coll.subscribe(async (ev) => {
        if (ev.offline) { offline = true; status(); return; }
        if (ev.resync) { offline = false; try { await loadShared(); } catch (err) { console.warn(err); } }
        for (const d of ev.docs || []) { const c = clean(d.data); if (c && !people.has(c.login)) fresh.add(c.login); adopt(d.data); }
        render();
      });
    }
  } catch (e) { console.warn("shared data unavailable", e); }
  poll();
})();
</script>
<script>
/* Link to the gallery. The publish script fills APP_ORIGIN and the id from ops/demo/ids.json;
   a link whose id is still a placeholder is never made. */
(() => {
  "use strict";
  const APP_ORIGIN = "{{origin}}";
  const IDS = { gallery: "{{id:gallery}}" };
  const resolved = (v) => typeof v === "string" && !v.startsWith("{" + "{");
  const VALID_ID = /^[A-Za-z0-9_-]{4,64}$/;
  let base = "";
  if (resolved(APP_ORIGIN) && /^https?:\/\/[^/]+$/.test(APP_ORIGIN)) base = APP_ORIGIN;
  else try {
    const anc = window.location.ancestorOrigins;
    if (anc && anc.length && anc[anc.length - 1] !== "null") base = anc[anc.length - 1];
  } catch {}
  for (const el of document.querySelectorAll("[data-demo-links]")) {
    const id = IDS.gallery;
    if (!resolved(id) || !VALID_ID.test(id)) continue;
    const a = document.createElement("a");
    a.href = `${base}/a/${id}`; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "All demos \u2197";
    el.replaceChildren(a); el.hidden = false;
  }
})();
</script>
