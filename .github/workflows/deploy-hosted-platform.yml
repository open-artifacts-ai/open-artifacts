# Deploys one env's hosted platform Workers (docs/ops/hosted.md) from a stable
# release tag, by hand only: the auth and directory brokers, dispatch, the
# scheduler, the inventory Worker and its key, and the zone wiring (DNS,
# routes, settings: planned, then applied in the same run). No one approves a
# run: the release gate (scripts/ci/tag-passed-checks.sh) refuses a tag unless
# every earlier check on it passed. Each env has its own Environment
# (hosted-staging-deploy, hosted-prod-deploy) holding the same-named secrets
# and variables; only main may run it. The code deployed is the tag's, never
# the branch's. verify_only deploys and sets nothing: it reads the live Workers
# back and runs every check, and the zones stay plan only.
name: deploy-hosted-platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Which env's Workers"
        required: true
        type: choice
        options: [staging, prod]
      tag:
        description: "Stable release tag to deploy (vX.Y.Z)"
        required: true
        type: string
      targets:
        description: "Comma-separated, in order: auth-broker,directory-broker,dispatch,scheduler,inventory,inventory-key,zones"
        required: true
        default: "auth-broker,directory-broker,dispatch,scheduler"
        type: string
      verify_only:
        description: "Read back and check only; deploy and set nothing"
        required: true
        default: false
        type: boolean

# actions: read lets the release gate read release-please.yml's run and jobs.
permissions:
  contents: read
  actions: read

concurrency:
  group: hosted-platform-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be a stable vX.Y.Z"; exit 1; }
          # Known targets only, each once, in dependency order (brokers before
          # dispatch and the scheduler, which bind them).
          order="auth-broker directory-broker dispatch scheduler inventory inventory-key zones"
          last=-1
          seen=""
          IFS=, read -ra list <<< "$TARGETS"
          [ "${#list[@]}" -gt 0 ] || { echo "no targets"; exit 1; }
          for t in "${list[@]}"; do
            i=0; pos=-1
            for o in $order; do [ "$o" = "$t" ] && pos=$i; i=$((i + 1)); done
            [ "$pos" -ge 0 ] || { echo "unknown target: $t"; exit 1; }
            case " $seen " in *" $t "*) echo "duplicate target: $t"; exit 1 ;; esac
            [ "$pos" -gt "$last" ] || { echo "targets out of order: $TARGETS"; exit 1; }
            last=$pos; seen="$seen $t"
          done
      # The gate is main's, like the deploy scripts; it runs before the tag's
      # code is checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: The tag passed every earlier check
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .release-gate/scripts/ci/tag-passed-checks.sh "$DEPLOY_ENV" "$TAG"
          rm -rf .release-gate
      - name: Prod runs only from main
        if: ${{ inputs.env == 'prod' }}
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The checkout is exactly the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "$TAG"
          test -z "$(git status --porcelain)"
      # The deploy logic is this workflow's own commit on main (reviewed, and
      # the Environment allows only main); what it deploys is the tag's.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .deploy-logic
          sparse-checkout: |
            scripts/ops
            packages/provision/src
          persist-credentials: false
      # main's provision pins the broker's Google client; the auth-broker
      # target refuses any other.
      - name: Use main's deploy scripts
        run: |
          set -euo pipefail
          for f in deploy-hosted-platform.sh deploy-platform-worker.sh hosted-zones.sh; do
            cp ".deploy-logic/scripts/ops/$f" "scripts/ops/$f"
          done
          cp .deploy-logic/packages/provision/src/wfp.ts "$RUNNER_TEMP/main-wfp.ts"
          rm -rf .deploy-logic
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build and test the Workers being deployed
        run: |
          set -euo pipefail
          pnpm --filter @oa/provision build
          pnpm --filter @oa/auth-broker --filter @oa/directory-broker --filter @oa/dispatch --filter @oa/scheduler --filter @oa/inventory test
      - name: Deploy and verify
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
          TARGETS: ${{ inputs.targets }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.HOSTED_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BROKER_REGISTRY_ID: ${{ vars.BROKER_REGISTRY_ID }}
          DIRECTORY_REGISTRY_ID: ${{ vars.DIRECTORY_REGISTRY_ID }}
          HOSTS_KV_ID: ${{ vars.HOSTS_KV_ID }}
          PLATFORM_DB_ID: ${{ vars.PLATFORM_DB_ID }}
          EMAIL_ZONE_TAGS: ${{ vars.EMAIL_ZONE_TAGS }}
          EMAIL_DAILY_LIMIT: ${{ vars.EMAIL_DAILY_LIMIT }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_DIRECTORY_CLIENT_ID: ${{ vars.GOOGLE_DIRECTORY_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DIRECTORY_CLIENT_SECRET: ${{ secrets.GOOGLE_DIRECTORY_CLIENT_SECRET }}
          INVENTORY_KEY: ${{ secrets.INVENTORY_KEY }}
          BROKER_PIN_FILE: ${{ runner.temp }}/main-wfp.ts
        run: |
          set -euo pipefail
          IFS=, read -ra list <<< "$TARGETS"
          for t in "${list[@]}"; do
            [ "$t" = zones ] && continue
            echo "::group::$DEPLOY_ENV $t"
            bash scripts/ops/deploy-hosted-platform.sh "$DEPLOY_ENV" "$t"
            echo "::endgroup::"
          done
      # Only this step sees the zone token. Plan, then apply (hosted-zones.sh
      # refuses anything outside its fixed set and reads every change back);
      # verify_only stays plan only. Both go to the job summary.
      - name: Zones
        if: ${{ contains(format(',{0},', inputs.targets), ',zones,') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.HOSTED_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ZONE_TOKEN: ${{ secrets.ZONE_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/ops/hosted-zones.sh "$DEPLOY_ENV" plan
          [ -n "$VERIFY_ONLY" ] || bash scripts/ops/hosted-zones.sh "$DEPLOY_ENV" apply
