# Deploys one env's hosted platform Workers (docs/ops/hosted.md) from a stable
# release tag, by hand only: the platform D1 migrations, the auth and directory
# brokers, the provision token's read-back, the provisioner, dispatch, the
# scheduler, the inventory Worker, the Provisioning API and the
# zone wiring (DNS, routes, settings: planned, then applied in the same run).
# No one approves a run: the release gate (scripts/ci/tag-passed-checks.sh)
# refuses a tag unless every earlier check on it passed, and prod's
# platform-db, provisioner and provisioning also need a green
# redline-staging.yml run for the same tag (scripts/ci/staging-first-gate.sh). Each env has its own
# Environment (hosted-staging-deploy, hosted-prod-deploy) holding the
# same-named secrets (one Cloudflare token, CLOUDFLARE_API_TOKEN); only main
# may run it. The constants are main's .github/hosted/<env>.json and the
# resource ids are looked up by name in the run. The code deployed is the
# tag's, never the branch's. verify_only deploys and sets nothing: it reads the
# live Workers back and runs every check, and the zones stay plan only. Every
# run also reads back the token's own end date and opens an issue 30 days
# ahead (scripts/ci/deploy-token-expiry.sh).
name: deploy-hosted-platform

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Which env's Workers"
        required: true
        type: choice
        options: [staging, prod]
      tag:
        description: "Stable release tag to deploy (vX.Y.Z)"
        required: true
        type: string
      targets:
        description: "Comma-separated, in order: platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,scheduler,inventory,provisioning,zones"
        required: true
        default: "auth-broker,directory-broker,dispatch,scheduler"
        type: string
      verify_only:
        description: "Read back and check only; deploy and set nothing"
        required: true
        default: false
        type: boolean

# actions: read lets the release gate read release-please.yml's run and jobs
# (and the staging-first gate redline-staging.yml's runs); issues: write lets
# the token read-back open its expiry issue.
permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: hosted-platform-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be a stable vX.Y.Z"; exit 1; }
          # Known targets only, each once, in dependency order: every bound
          # target before its binder (design v7 10.2).
          order="platform-db auth-broker directory-broker provision-token provisioner dispatch scheduler inventory provisioning zones"
          last=-1
          seen=""
          IFS=, read -ra list <<< "$TARGETS"
          [ "${#list[@]}" -gt 0 ] || { echo "no targets"; exit 1; }
          for t in "${list[@]}"; do
            i=0; pos=-1
            for o in $order; do [ "$o" = "$t" ] && pos=$i; i=$((i + 1)); done
            [ "$pos" -ge 0 ] || { echo "unknown target: $t"; exit 1; }
            case " $seen " in *" $t "*) echo "duplicate target: $t"; exit 1 ;; esac
            [ "$pos" -gt "$last" ] || { echo "targets out of order: $TARGETS"; exit 1; }
            last=$pos; seen="$seen $t"
          done
      # The gate is main's, like the deploy scripts; it runs before the tag's
      # code is checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: The tag passed every earlier check
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .release-gate/scripts/ci/tag-passed-checks.sh "$DEPLOY_ENV" "$TAG"
          rm -rf .release-gate
      - name: Prod runs only from main
        if: ${{ inputs.env == 'prod' }}
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The checkout is exactly the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "$TAG"
          test -z "$(git status --porcelain)"
      # The deploy logic is this workflow's own commit on main (reviewed, and
      # the Environment allows only main); what it deploys is the tag's.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .deploy-logic
          sparse-checkout: |
            scripts/ops
            scripts/ci
            packages/provision/src
            apps/platform-db
            .github/hosted
          persist-credentials: false
      # main's provision pins the broker's Google client; the auth-broker
      # target refuses any other.
      - name: Use main's deploy scripts
        run: |
          set -euo pipefail
          for f in deploy-hosted-platform.sh deploy-platform-worker.sh hosted-zones.sh platform-db.ts check-migration-lock.mjs wrangler-env.ts broker-key.ts; do
            cp ".deploy-logic/scripts/ops/$f" "scripts/ops/$f"
          done
          cp .deploy-logic/packages/provision/src/wfp.ts "$RUNNER_TEMP/main-wfp.ts"
          mkdir "$RUNNER_TEMP/main-ci"
          for f in hosted-cf.sh hosted-constants.sh hosted-resource-ids.sh staging-first-gate.sh deploy-token-expiry.sh; do
            cp ".deploy-logic/scripts/ci/$f" "$RUNNER_TEMP/main-ci/$f"
          done
          cp -R .deploy-logic/.github/hosted "$RUNNER_TEMP/main-ci/hosted"
          # main's migration pins: the tag may add a migration, never re-pin one.
          cp .deploy-logic/apps/platform-db/migration-lock.json "$RUNNER_TEMP/main-ci/migration-lock.json"
          rm -rf .deploy-logic
      # Staging first, automatic: prod's platform-db, provisioner and
      # provisioning deploy a tag only after redline-staging.yml passed it
      # (within 7 days; scripts/ci/staging-first-gate.sh states the contract).
      - name: Staging passed this tag
        if: ${{ inputs.env == 'prod' && (contains(format(',{0},', inputs.targets), ',platform-db,') || contains(format(',{0},', inputs.targets), ',provisioner,') || contains(format(',{0},', inputs.targets), ',provisioning,')) }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/main-ci/staging-first-gate.sh" "$TAG"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build and test the Workers being deployed
        run: |
          set -euo pipefail
          pnpm --filter @oa/provision build
          pnpm --filter @oa/auth-broker --filter @oa/directory-broker --filter @oa/dispatch --filter @oa/scheduler --filter @oa/inventory --filter @oa/provisioner --filter @oa/provisioning --filter @oa/admin test
      # main's committed constants (account id, email, Google client ids).
      - name: Load the hosted constants
        env:
          DEPLOY_ENV: ${{ inputs.env }}
        run: bash "$RUNNER_TEMP/main-ci/hosted-constants.sh" "$DEPLOY_ENV" "$RUNNER_TEMP/main-ci/hosted"
      # The D1 and KV ids, the sending zone's tag and the Secrets Store id, by
      # exact name on the account (exactly one each); only for the targets
      # that use them (the store for provision-token and provisioner only).
      - name: Resolve the resource ids
        if: ${{ contains(format(',{0},', inputs.targets), ',platform-db,') || contains(format(',{0},', inputs.targets), ',auth-broker,') || contains(format(',{0},', inputs.targets), ',directory-broker,') || contains(format(',{0},', inputs.targets), ',provision-token,') || contains(format(',{0},', inputs.targets), ',provisioner,') || contains(format(',{0},', inputs.targets), ',dispatch,') || contains(format(',{0},', inputs.targets), ',scheduler,') || contains(format(',{0},', inputs.targets), ',inventory,') || contains(format(',{0},', inputs.targets), ',provisioning,') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TARGETS: ${{ inputs.targets }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash "$RUNNER_TEMP/main-ci/hosted-resource-ids.sh" "$DEPLOY_ENV"
      - name: Deploy and verify
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
          TARGETS: ${{ inputs.targets }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DIRECTORY_CLIENT_SECRET: ${{ secrets.GOOGLE_DIRECTORY_CLIENT_SECRET }}
          BROKER_PIN_FILE: ${{ runner.temp }}/main-wfp.ts
          MAIN_MIGRATION_LOCK: ${{ runner.temp }}/main-ci/migration-lock.json
          # The OIDC principal's repository (inventory, staging's provisioning);
          # GITHUB_REPOSITORY (owner/repo) is the runner's own.
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          IFS=, read -ra list <<< "$TARGETS"
          for t in "${list[@]}"; do
            [ "$t" = zones ] && continue
            echo "::group::$DEPLOY_ENV $t"
            bash scripts/ops/deploy-hosted-platform.sh "$DEPLOY_ENV" "$t"
            echo "::endgroup::"
          done
      # Plan, then apply (hosted-zones.sh refuses anything outside its fixed
      # set and reads every change back);
      # verify_only stays plan only. Both go to the job summary.
      - name: Zones
        if: ${{ contains(format(',{0},', inputs.targets), ',zones,') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/ops/hosted-zones.sh "$DEPLOY_ENV" plan
          [ -n "$VERIFY_ONLY" ] || bash scripts/ops/hosted-zones.sh "$DEPLOY_ENV" apply
      # The token's own end date (provision's checkToken never sees it): an
      # issue naming only the secret, 30 days ahead.
      - name: The deploy token's expiry
        if: ${{ !cancelled() }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/main-ci/deploy-token-expiry.sh" "$DEPLOY_ENV"
