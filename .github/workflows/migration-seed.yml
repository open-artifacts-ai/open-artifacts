name: migration-seed
# Keeps CI's migration-timing seed (#1213) in main's cache scope. Pull
# requests and merge-queue runs can restore only their own caches and main's,
# and CI doesn't run on push to main (#965). The seed's key changes with the
# last release's migrations or the seeder, so this runs when the seeder or
# the release manifest changes on main, and daily (a release's tag can land
# after its manifest push). A hit ends in seconds. No secrets; never a
# required check.
on:
  push:
    branches: [main]
    paths:
      - apps/server/scripts/migration-seed.ts
      - apps/server/scripts/migration-timing.ts
      - .release-please-manifest.json
      - .github/workflows/migration-seed.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-seed
  cancel-in-progress: true
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: key
        run: |
          key="$(node --experimental-strip-types --no-warnings apps/server/scripts/migration-timing.ts --key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/oa-migration-seed
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: node --experimental-strip-types --no-warnings apps/server/scripts/migration-timing.ts --seed-only --seed-file "$HOME/.cache/oa-migration-seed/seed.sqlite"
      - if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/oa-migration-seed
          key: ${{ steps.key.outputs.key }}
