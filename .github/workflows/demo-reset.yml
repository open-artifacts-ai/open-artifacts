name: Demo reset
# Nightly reset of the public demo (demo.open-artifacts.com). Off until the repository
# variable DEMO_ENABLED is 'true'. Uses the demo's own PAT, never a PROD secret.
# Runs at 23:59 UTC: the reset replaces all data, so it clears the finished day instead of
# wiping the new day-keyed collections.
on:
  schedule:
    - cron: "59 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-reset
  cancel-in-progress: false
jobs:
  reset:
    if: ${{ github.ref == 'refs/heads/main' && vars.DEMO_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write the PAT file
        env:
          DEMO_OA_TOKEN: ${{ secrets.DEMO_OA_TOKEN }}
        run: |
          umask 077
          printf '%s' "$DEMO_OA_TOKEN" > "$RUNNER_TEMP/pat"
      - name: Build the seed from the per-slug seeds
        run: node --experimental-strip-types scripts/demo/publish.ts --write-seed "$RUNNER_TEMP/seed.json"
      - name: Reset the demo from the seed
        run: >-
          node --experimental-strip-types scripts/demo/reset.ts
          --base-url https://demo.open-artifacts.com
          --token-file "$RUNNER_TEMP/pat" "$RUNNER_TEMP/seed.json" --apply
      - name: Check healthz
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://demo.open-artifacts.com/healthz
      - name: Remove the PAT file
        if: always()
        run: rm -f "$RUNNER_TEMP/pat"
