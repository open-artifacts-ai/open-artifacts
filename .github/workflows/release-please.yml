name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose landing site to (re)deploy
        required: true
        type: string
      restore_on_failure:
        description: >-
          Prod, a release with a non-additive migration only: if the upgrade or
          its verification fails, roll the Worker back and restore D1 to the
          pre-migration bookmark (needs the user's yes for that release)
        required: false
        type: boolean
        default: false
# No workflow-wide grant: every job sets its own permissions (T3b). Only
# hosted-attach may write contents; no job has actions: write.
permissions: {}
jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    # Every write (release PR, tags, releases) uses the release App's token
    # (token: below); nothing here uses GITHUB_TOKEN, so it gets no scope.
    permissions: {}
    # Back-to-back pushes queue instead of racing on the release PR ("Error updating ref").
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # The release App's token, not GITHUB_TOKEN: PRs and pushes made with
      # GITHUB_TOKEN trigger no workflows, so the release PR's required checks would
      # never run.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  deploy-landing:
    needs: [release-please]
    # always(): on workflow_dispatch the release-please job is skipped.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - id: gate
        run: |
          if [ -f apps/landing/wrangler.jsonc ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build landing
        if: steps.gate.outputs.present == 'true'
        run: pnpm --filter @oa/landing build
      # The release is already created by release-please above, so
      # failing here does not undo the release; it only blocks a not-ready landing.
      # Re-run via workflow_dispatch with the tag once the landing is clean.
      - name: Check landing is release-ready
        if: steps.gate.outputs.present == 'true'
        run: node scripts/ops/check-landing-dist.ts apps/landing/dist
      - name: Deploy landing to production (open-artifacts.com)
        if: steps.gate.outputs.present == 'true'
        run: cd apps/landing && pnpm exec wrangler deploy
  # Stable releases only; independent of deploy-landing. Never runs from a bare push to main.
  deploy-prod:
    needs: [release-please]
    outputs:
      installed: ${{ steps.preflight.outputs.installed }}
      # 'true' when the migration guard held the deploy (prod stays on the old version).
      held: ${{ steps.migration.outputs.hold }}
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: prod
      cancel-in-progress: false
    env:
      PROD_NAME: open-artifacts-prod
      PROD_APP_HOST: artifacts.leourbina.com
      PROD_CONTENT_HOST: artifacts-content.leourbina.com
      PROD_OWNER_EMAIL: me@leourbina.com
      # Direct sign-in (docs/self-hosting/direct-sign-in.md): repository
      # variables, read by prod-setup.sh from env. Unset keeps the live value.
      PROD_AUTH_PROVIDERS: ${{ vars.PROD_AUTH_PROVIDERS }}
      PROD_AUTH_DOMAINS: ${{ vars.PROD_AUTH_DOMAINS }}
      PROD_AUTH_DOMAIN_JOIN: ${{ vars.PROD_AUTH_DOMAIN_JOIN }}
      PROD_GOOGLE_CLIENT_ID: ${{ vars.PROD_GOOGLE_CLIENT_ID }}
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - id: guard
        name: Require stable release (latest, for manual redeploys)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease -q .isPrerelease) || { echo "release $TAG not found"; exit 1; }
          if [ "$pre" != "false" ]; then
            echo "$TAG is a pre-release; not deploying prod"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            latest=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
            [ "$latest" = "$TAG" ] || { echo "$TAG is not the latest stable release ($latest)"; exit 1; }
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # Tags and history: the migration guard compares TAG with the
          # previous stable release.
          fetch-depth: 0
      - if: steps.guard.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.guard.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      # A release that adds a non-additive migration (first line
      # `-- oa:non-additive`, e.g. a table rebuild) is held: only a manual run
      # deploys it, guarded (record, upgrade, verify, restore on failure). Any
      # doubt holds; every later step needs hold == 'false', so a guard that
      # didn't run deploys nothing.
      - id: migration
        name: Non-additive migration guard
        if: steps.guard.outputs.deploy == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci/prod-migration-guard.sh detect
      # The release bundle must hold no /__test/* hooks; a failure stops the deploy.
      - name: Build the release bundle (buildBundle, dry run)
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false'
        run: |
          pnpm --filter @oa/provision build
          pnpm --filter @oa/server run gen
          mkdir -p apps/server/dist-assets
          node --experimental-strip-types scripts/ci/build-release-bundle.ts "$RUNNER_TEMP/release-bundle" --variant release
      - name: No test hooks in the release bundle
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false'
        run: pnpm check-no-test-hooks "$RUNNER_TEMP/release-bundle"
      - name: No red-line fake IdP in the release bundle
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false'
        run: pnpm check-no-fake-idp "$RUNNER_TEMP/release-bundle"
      - id: preflight
        name: Preflight (read-only; skips if not installed, fails if drifted or partial)
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          OA_ACCESS_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/prod-setup.sh preflight
      - id: record
        name: Record the Worker version and a D1 Time Travel bookmark; capture the database
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false' && steps.preflight.outputs.installed == 'true' && steps.migration.outputs.guarded == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/prod-migration-guard.sh record
      - name: Upgrade prod (deploy + selftest, CI token)
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false' && steps.preflight.outputs.installed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          OA_ACCESS_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
          # L10: the deploy step runs check-no-test-hooks on its own dry-run
          # build of the config it deploys, right before `wrangler deploy`.
          OA_CHECK_NO_TEST_HOOKS: "1"
        run: bash scripts/ci/prod-setup.sh upgrade
      - id: verify
        name: Verify the migrated database against the capture
        if: steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false' && steps.preflight.outputs.installed == 'true' && steps.migration.outputs.guarded == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/prod-migration-guard.sh verify
      # The upgrade or its verification failed after the bookmark: roll the
      # Worker back (new code can't run on the old schema), then restore D1,
      # then compare it with the capture. Only when this run allows it (the
      # user's yes for that release); otherwise page with what to restore.
      - name: Roll the Worker back and restore D1 to the bookmark
        if: failure() && steps.migration.outputs.guarded == 'true' && steps.record.outcome == 'success' && inputs.restore_on_failure == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_VERSION: ${{ steps.record.outputs.worker_version }}
          BOOKMARK: ${{ steps.record.outputs.bookmark }}
        run: bash scripts/ci/prod-migration-guard.sh restore
      - name: Page (verification failed; no restore authorized for this run)
        if: failure() && steps.migration.outputs.guarded == 'true' && steps.record.outcome == 'success' && inputs.restore_on_failure != true
        env:
          WORKER_VERSION: ${{ steps.record.outputs.worker_version }}
          BOOKMARK: ${{ steps.record.outputs.bookmark }}
        run: |
          echo "::error title=Prod migration failed::not restored (not authorized for this run). Worker before: $WORKER_VERSION; D1 bookmark: $BOOKMARK"
          echo "**Not restored.** Worker before: \`$WORKER_VERSION\`; D1 bookmark: \`$BOOKMARK\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke leaked setup-ci tokens
        if: always() && steps.guard.outputs.deploy == 'true' && steps.migration.outputs.hold == 'false' && steps.preflight.outputs.installed != 'false'
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          OA_ACCESS_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/prod-setup.sh cleanup
  # The public demo, in parallel with deploy-prod: off until the repository variable
  # DEMO_ENABLED is 'true' (after ops-demo-install has run). Staging credentials only.
  deploy-demo:
    needs: [release-please]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.DEMO_ENABLED == 'true' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    env:
      DEMO_NAME: open-artifacts-demo
      DEMO_APP_HOST: demo.open-artifacts.com
      DEMO_CONTENT_HOST: demo-content.open-artifacts.com
      DEMO_OWNER_EMAIL: me@leourbina.com
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - id: guard
        name: Require stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease -q .isPrerelease) || { echo "release $TAG not found"; exit 1; }
          if [ "$pre" != "false" ]; then
            echo "$TAG is a pre-release; not deploying the demo"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - if: steps.guard.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.guard.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Upgrade the demo
        if: steps.guard.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OA_ACCESS_TOKEN: ${{ secrets.DEMO_OA_ACCESS_TOKEN }}
          DEMO_PUBLIC_HOME: ${{ vars.DEMO_PUBLIC_HOME }}
        run: bash scripts/ci/prod-setup.sh demo-upgrade
      - name: Revoke leaked setup-ci tokens
        if: always() && steps.guard.outputs.deploy == 'true'
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OA_ACCESS_TOKEN: ${{ secrets.DEMO_OA_ACCESS_TOKEN }}
        run: bash scripts/ci/prod-setup.sh demo-cleanup
  # Runs once a release was created, after every deploy (whatever their result; deploy-demo is skipped while DEMO_ENABLED is off): the
  # live prod healthz and the landing meta must show the released version, else a
  # `blocker` issue is opened and this job fails. Skipped for pre-release tags.
  verify-release:
    needs: [release-please, deploy-prod, deploy-landing, deploy-demo]
    # A new stable release, or a dispatch whose prod deploy succeeded (the guarded
    # deploy of a held release): prod is verified live on that tag either way.
    if: ${{ always() && ((needs.release-please.outputs.release_created == 'true' && !contains(needs.release-please.outputs.tag_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && !contains(inputs.tag, '-') && needs.deploy-prod.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # deploy-prod skipped itself (prod not installed) or the migration guard held
      # the release for a guarded dispatch: prod is not on this tag, so don't verify it.
      SKIP_PROD: ${{ (needs.deploy-prod.outputs.installed == 'false' || needs.deploy-prod.outputs.held == 'true') && '--skip-prod' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify the release is live
        if: ${{ vars.DEMO_ENABLED != 'true' }}
        run: node --experimental-strip-types scripts/ci/verify-release.ts --tag "$TAG" --repo "$GITHUB_REPOSITORY" ${SKIP_PROD:+"$SKIP_PROD"}
      - name: Verify the release is live (with the demo)
        if: ${{ vars.DEMO_ENABLED == 'true' }}
        run: node --experimental-strip-types scripts/ci/verify-release.ts --tag "$TAG" --repo "$GITHUB_REPOSITORY" --demo-url https://demo.open-artifacts.com ${SKIP_PROD:+"$SKIP_PROD"}
  # ---------- hosted release files (T3b) ----------
  # Stable releases only. CI signs and never uploads to Cloudflare: the signed
  # tars and .sig.json files are attached to the GitHub release, and
  # publishRelease (on a laptop, the env's R2 API token) verifies them and copies
  # them to R2. The signing key never shares a job with installed code.
  hosted-guard:
    needs: [release-please]
    # always(): on workflow_dispatch the release-please job is skipped.
    if: ${{ always() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        name: Resolve the tag to one commit on main, matching package.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not a stable vX.Y.Z tag"; exit 1; }
          pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease -q .isPrerelease)
          [ "$pre" = "false" ] || { echo "$TAG is a pre-release; no hosted release files"; exit 1; }
          # <tag>^{commit}, resolved once here; every later job checks out this SHA.
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          sha=$(jq -r .object.sha <<< "$ref")
          type=$(jq -r .object.type <<< "$ref")
          for _ in 1 2 3 4; do
            [ "$type" = tag ] || break
            obj=$(gh api "repos/$REPO/git/tags/$sha")
            sha=$(jq -r .object.sha <<< "$obj")
            type=$(jq -r .object.type <<< "$obj")
          done
          if [ "$type" != commit ] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "$TAG does not resolve to a commit"
            exit 1
          fi
          # L4: main's branch SHA, never the bare name (a tag named main would win).
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read main"; exit 1; }
          status=$(gh api "repos/$REPO/compare/$main_sha...$sha" -q .status)
          case "$status" in
            behind|identical) ;;
            *) echo "$TAG ($sha) is not on main (compare: $status)"; exit 1 ;;
          esac
          version=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/package.json?ref=$sha" | jq -r .version)
          [ "$version" = "${TAG#v}" ] || { echo "package.json at $sha is $version, not ${TAG#v}"; exit 1; }
          # L5: the release commit itself: the release's target (when a SHA),
          # and the commit where package.json's version changed.
          target=$(gh api "repos/$REPO/releases/tags/$TAG" -q .target_commitish)
          if [[ "$target" =~ ^[0-9a-f]{40}$ ]] && [ "$target" != "$sha" ]; then
            echo "$TAG points at $sha but its release targets $target"; exit 1
          fi
          parent=$(gh api "repos/$REPO/commits/$sha" -q '.parents[0].sha')
          prev=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/package.json?ref=$parent" | jq -r .version)
          [ "$prev" != "$version" ] || { echo "package.json's version did not change in $sha; not the release commit"; exit 1; }
          { echo "sha=$sha"; echo "tag=$TAG"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
  hosted-build:
    needs: [hosted-guard]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      # No dependency cache: a main-scoped pnpm store would feed the signed bytes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # The server reports <version> only when v<version> points at HEAD, and a
      # checkout by SHA has no tags: fetch this one and check it is this commit.
      - name: Fetch the release tag
        env:
          TAG: ${{ needs.hosted-guard.outputs.tag }}
          GUARD_SHA: ${{ needs.hosted-guard.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GUARD_SHA"
      - name: Build both variants and the release files, with manifest.json
        env:
          GUARD_SHA: ${{ needs.hosted-guard.outputs.sha }}
        run: |
          pnpm --filter @oa/provision build
          pnpm --filter @oa/server build
          node --experimental-strip-types scripts/ci/build-hosted-release.ts "$RUNNER_TEMP/hosted" --commit "$GUARD_SHA"
      - name: The built server reports exactly the release version
        env:
          VERSION: ${{ needs.hosted-guard.outputs.version }}
        run: grep -Fqx "export const VERSION = \"$VERSION\";" apps/server/src/version.gen.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
          if-no-files-found: error
          retention-days: 7
  hosted-check:
    needs: [hosted-guard, hosted-build]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bundle_sha256: ${{ steps.check.outputs.bundle_sha256 }}
      manifest_sha256: ${{ steps.check.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      # No dependency cache: a main-scoped pnpm store would feed the signed bytes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      # The hashes are recomputed from the bytes check-no-test-hooks ran on,
      # before and after, and handed to hosted-sign.
      - id: check
        name: Verify manifest.json, then no test hooks in the release bundle
        run: |
          set -euo pipefail
          before=$(node --experimental-strip-types --no-warnings scripts/ci/check-hosted-release.ts "$RUNNER_TEMP/hosted")
          pnpm check-no-test-hooks "$RUNNER_TEMP/hosted/release"
          pnpm check-no-fake-idp "$RUNNER_TEMP/hosted/release"
          after=$(node --experimental-strip-types --no-warnings scripts/ci/check-hosted-release.ts "$RUNNER_TEMP/hosted")
          [ "$before" = "$after" ] || { echo "the artifact changed during the check"; exit 1; }
          echo "$after" >> "$GITHUB_OUTPUT"
  hosted-sign-staging:
    needs: [hosted-guard, hosted-build, hosted-check]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-build.result == 'success' && needs.hosted-check.result == 'success' }}
    runs-on: ubuntu-latest
    # The staging key lives only in this GitHub Environment (main only, no admin bypass, no approval step).
    environment: hosted-staging
    permissions:
      contents: read
    concurrency:
      group: hosted-sign-staging-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    outputs:
      staging_signed: ${{ steps.sign.outputs.staging_signed }}
      staging_release_signature: ${{ steps.sign.outputs.staging_release_signature }}
      staging_release_tar_sha256: ${{ steps.sign.outputs.staging_release_tar_sha256 }}
      staging_release_record_sha256: ${{ steps.sign.outputs.staging_release_record_sha256 }}
      staging_redline_signature: ${{ steps.sign.outputs.staging_redline_signature }}
      staging_redline_tar_sha256: ${{ steps.sign.outputs.staging_redline_tar_sha256 }}
      staging_redline_record_sha256: ${{ steps.sign.outputs.staging_redline_record_sha256 }}
    # Exactly these steps: no install, no other action, node:* imports only.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          persist-credentials: false
      # Decision 4 (Manager review), H-N22: Node 22 from .nvmrc via setup-node
      # pinned by SHA, no cache; plain .mjs, no strip-types. The key is only in
      # the sign step's env.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Assert Node 22
        run: v=$(node --version); case "$v" in v22.*) ;; *) echo "expected Node 22, got $v" >&2; exit 1;; esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      - id: sign
        name: Sign (the key goes in on stdin only)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGN_ENV: staging
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          GUARD_SHA: ${{ needs.hosted-guard.outputs.sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_KEY" | node scripts/ci/sign-release.mjs --dir "$RUNNER_TEMP/hosted" --env "$SIGN_ENV" --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$GUARD_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" >> "$GITHUB_OUTPUT"
  hosted-sign-prod:
    needs: [hosted-guard, hosted-build, hosted-check]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-build.result == 'success' && needs.hosted-check.result == 'success' }}
    runs-on: ubuntu-latest
    # The prod key lives only in this GitHub Environment (main only, no admin bypass, no approval step for now; a reviewer comes back before FinQore go-live).
    environment: hosted-prod
    permissions:
      contents: read
    concurrency:
      group: hosted-sign-prod-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    outputs:
      prod_signed: ${{ steps.sign.outputs.prod_signed }}
      prod_release_signature: ${{ steps.sign.outputs.prod_release_signature }}
      prod_release_tar_sha256: ${{ steps.sign.outputs.prod_release_tar_sha256 }}
      prod_release_record_sha256: ${{ steps.sign.outputs.prod_release_record_sha256 }}
    # Exactly these steps: no install, no other action, node:* imports only.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          persist-credentials: false
      # Decision 4 (Manager review), H-N22: Node 22 from .nvmrc via setup-node
      # pinned by SHA, no cache; plain .mjs, no strip-types. The key is only in
      # the sign step's env.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Assert Node 22
        run: v=$(node --version); case "$v" in v22.*) ;; *) echo "expected Node 22, got $v" >&2; exit 1;; esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      - id: sign
        name: Sign (the key goes in on stdin only)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGN_ENV: prod
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          GUARD_SHA: ${{ needs.hosted-guard.outputs.sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_KEY" | node scripts/ci/sign-release.mjs --dir "$RUNNER_TEMP/hosted" --env "$SIGN_ENV" --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$GUARD_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" >> "$GITHUB_OUTPUT"
  hosted-attach-staging:
    needs: [hosted-guard, hosted-build, hosted-check, hosted-sign-staging]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-check.result == 'success' && needs.hosted-sign-staging.result == 'success' && needs.hosted-sign-staging.outputs.staging_signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hosted-attach-staging-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
