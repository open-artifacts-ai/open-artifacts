      # (pinned key). Refuses if any staging asset is already on the release.
      - name: Attach the signed staging release files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.hosted-guard.outputs.tag }}
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          GUARD_SHA: ${{ needs.hosted-guard.outputs.sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
          RELEASE: ${{ needs.hosted-sign-staging.outputs.staging_release_signature }}:${{ needs.hosted-sign-staging.outputs.staging_release_tar_sha256 }}:${{ needs.hosted-sign-staging.outputs.staging_release_record_sha256 }}
          REDLINE: ${{ needs.hosted-sign-staging.outputs.staging_redline_signature }}:${{ needs.hosted-sign-staging.outputs.staging_redline_tar_sha256 }}:${{ needs.hosted-sign-staging.outputs.staging_redline_record_sha256 }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep '^oa-release-staging-' || true)
