# Runs one oa:hosted operation (docs/ops/hosted.md, "The oa:hosted CLI") in
# CI, by hand only: create, upgrade, rollback, update-vars, status, delete,
# release-lease, turnstile-init, publish-release or publish-floor. Each env has
# its own Environment (hosted-staging-deploy, hosted-prod-deploy) holding one
# Cloudflare token, CLOUDFLARE_API_TOKEN; the R2 key and the Turnstile keys are
# derived from it in the run, and the constants are committed
# (.github/hosted/<env>.json). No run waits for a person: automated gates
# decide. Prod runs only from main (checked here and again by the CLI), and a
# prod create or upgrade first needs the precheck job ("prod is clean").
# Inputs reach the CLI only through env and the ci-args validator, never as
# shell text.
# create, upgrade, rollback and update-vars selftest on an ephemeral owner
# token (ci-<run id>) that the always() sweep revokes and verifies.
name: hosted-ops

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Which env"
        required: true
        type: choice
        options: [staging, prod]
      op:
        description: "The oa:hosted operation"
        required: true
        type: choice
        options:
          - status
          - create
          - upgrade
          - rollback
          - update-vars
          - delete
          - release-lease
          - turnstile-init
          - publish-release
          - publish-floor
      install:
        description: "Install id (iXXXXXXXXXXX); empty for create and the env-level ops"
        required: false
        default: ""
        type: string
      tag:
        description: "Stable release tag (vX.Y.Z): create and upgrade (the version), publish-release"
        required: false
        default: ""
        type: string
      args:
        description: 'JSON per op, e.g. create {"slug":"x","var":["AUTH_PROVIDERS=email"]}, update-vars {"var":[...]}. Inputs are public: create takes its owner email from the CREATE_OWNER_EMAIL secret'
        required: false
        default: "{}"
        type: string
      confirm:
        description: "delete and release-lease: the install id again"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # The release gate reads the tag's release-please run and jobs.
  actions: read

concurrency:
  group: hosted-ops-${{ inputs.env }}-${{ inputs.install || inputs.env }}
  cancel-in-progress: false

jobs:
  # Prod create and upgrade only: prodClean (tests/redline/src/prod-clean-cli.ts)
  # in redline-staging, where the read-only REDLINE_PROD_* secrets live. Any
  # result but a pass (or, for a create, an inventory listing no install)
  # fails it, and op does not run.
  precheck:
    if: ${{ inputs.env == 'prod' && (inputs.op == 'create' || inputs.op == 'upgrade') }}
    runs-on: ubuntu-latest
    environment: redline-staging
    timeout-minutes: 15
    steps:
      - name: Prod runs only from main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oa/provision build
      # Only this step sees the secrets: all three, none empty.
      - name: Write the prod probe's token files
        env:
          PROD_R2_TOKEN: ${{ secrets.REDLINE_PROD_R2_TOKEN }}
          PROD_SCRIPTS_TOKEN: ${{ secrets.REDLINE_PROD_SCRIPTS_TOKEN }}
          PROD_INVENTORY_KEY: ${{ secrets.REDLINE_PROD_INVENTORY_KEY }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/prod-clean-secrets"
          mkdir -m 700 "$d"
          printf '%s' "$PROD_R2_TOKEN" > "$d/REDLINE_PROD_R2_TOKEN"
          printf '%s' "$PROD_SCRIPTS_TOKEN" > "$d/REDLINE_PROD_SCRIPTS_TOKEN"
          printf '%s' "$PROD_INVENTORY_KEY" > "$d/REDLINE_PROD_INVENTORY_KEY"
          for f in "$d"/*; do test -s "$f" || { echo "empty secret file: ${f##*/}"; exit 1; }; done
      - name: Prod is clean
        env:
          OPS_OP: ${{ inputs.op }}
          REDLINE_PROD_SECRETS_DIR: ${{ runner.temp }}/prod-clean-secrets
          REDLINE_PROD_ACCOUNT_ID: ${{ vars.REDLINE_PROD_ACCOUNT_ID }}
          REDLINE_PROD_INVENTORY_URL: ${{ vars.REDLINE_PROD_INVENTORY_URL }}
        run: node tests/redline/src/prod-clean-cli.ts
      - name: Remove the token files
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/prod-clean-secrets"
  op:
    needs: precheck
    # A skipped precheck is fine only for the runs it does not gate.
    if: ${{ !cancelled() && (needs.precheck.result == 'success' || (needs.precheck.result == 'skipped' && !(inputs.env == 'prod' && (inputs.op == 'create' || inputs.op == 'upgrade')))) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
    timeout-minutes: 45
    steps:
      - name: Prod runs only from main
        if: ${{ inputs.env == 'prod' }}
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      # The CLI is this workflow's own commit (main for prod).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oa/provision build
      # The committed constants (account id and the rest), into GITHUB_ENV.
      - name: Load the hosted constants
        env:
          OPS_ENV: ${{ inputs.env }}
        run: bash scripts/ci/hosted-constants.sh "$OPS_ENV" .github/hosted
      # Every input goes through env to the validator, which prints the argv
      # as a JSON array (and the install the sweep needs to GITHUB_OUTPUT).
      - name: Check the inputs
        id: args
        env:
          OPS_ENV: ${{ inputs.env }}
          OPS_OP: ${{ inputs.op }}
          OPS_INSTALL: ${{ inputs.install }}
          OPS_TAG: ${{ inputs.tag }}
          OPS_ARGS: ${{ inputs.args }}
          OPS_CONFIRM: ${{ inputs.confirm }}
          # Never an input (inputs are public): the Environment secret, create only.
          OPS_OWNER: ${{ inputs.op == 'create' && secrets.CREATE_OWNER_EMAIL || '' }}
          OPS_FLOOR_FILE: ${{ runner.temp }}/hosted-ops-floor.sig.json
        run: |
          set -euo pipefail
          node scripts/hosted/src/ci-args.ts > "$RUNNER_TEMP/hosted-ops-argv.json"
      # Before any token is read: the release being installed (create,
      # upgrade) or published passed every earlier check on its tag. Fails
      # closed, also on an empty tag or an API error.
      - name: Release gate
        if: ${{ contains(fromJSON('["create","upgrade","publish-release"]'), inputs.op) }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_ENV: ${{ inputs.env }}
          RELEASE: ${{ steps.args.outputs.release }}
        run: scripts/ci/tag-passed-checks.sh "$OPS_ENV" "$RELEASE"
      # Only this step sees the secret, the env's one Cloudflare token. From it:
      # the R2 key (publish ops only) and the Turnstile keys (the ops that
      # render an install's vars), each fail closed.
      - name: Write the token files
        id: tok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_ENV: ${{ inputs.env }}
          OPS_OP: ${{ inputs.op }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/hosted-ops-secrets"
          mkdir -m 700 "$dir"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is not set in this Environment"; exit 1; }
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" > "$dir/token"
          case "$OPS_OP" in
            publish-release | publish-floor) bash scripts/ci/hosted-r2-key.sh "$dir/r2" ;;
          esac
          case "$OPS_OP" in
            create | upgrade | rollback | update-vars)
              bash scripts/ci/hosted-turnstile-keys.sh "$OPS_ENV" "$dir/turnstile"
              # No widget: no file and no flag, as before.
              if [ -s "$dir/turnstile" ]; then echo "turnstile=1" >> "$GITHUB_OUTPUT"; fi
              ;;
          esac
      - name: Run the operation
        id: run
        env:
          OA_HOSTED_TOKEN_FILE: ${{ runner.temp }}/hosted-ops-secrets/token
          OA_HOSTED_R2_FILE: ${{ runner.temp }}/hosted-ops-secrets/r2
          # Named only when the file was written (the ops that render vars).
          OA_HOSTED_TURNSTILE_FILE: ${{ steps.tok.outputs.turnstile == '1' && format('{0}/hosted-ops-secrets/turnstile', runner.temp) || '' }}
          OA_HOSTED_ENVIRONMENT: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
          GH_TOKEN: ${{ inputs.op == 'publish-release' && github.token || '' }}
        run: |
          set -euo pipefail
          # NUL-separated: each JSON string is one argv entry, never re-split.
          argv=()
          while IFS= read -r -d '' a; do argv+=("$a"); done < <(jq -j '.[] | (., "\u0000")' "$RUNNER_TEMP/hosted-ops-argv.json")
          [ "${#argv[@]}" -gt 0 ] || { echo "no argv"; exit 1; }
          pnpm -s oa:hosted "${argv[@]}" | tee "$RUNNER_TEMP/hosted-ops-out.jsonl"
      # A crashed run may leave its ci-<run id> token live: revoke it and
      # verify none remains. A create learns its install id from the CLI.
      - name: Sweep the CI owner token
        if: ${{ always() && contains(fromJSON('["create","upgrade","rollback","update-vars"]'), inputs.op) }}
        env:
          OA_HOSTED_TOKEN_FILE: ${{ runner.temp }}/hosted-ops-secrets/token
          OA_HOSTED_ENVIRONMENT: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
          OPS_ENV: ${{ inputs.env }}
          INSTALL: ${{ steps.args.outputs.install }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hosted-ops-out.jsonl"
          id="$INSTALL"
          if [ -z "$id" ] && [ -f "$out" ]; then
            id="$(jq -r 'select(.step == "ci-owner-token") | .install' "$out" | tail -n 1)"
          fi
          if [ -z "$id" ]; then
            # No install: nothing was minted, unless the CLI never finished.
            if [ "$RUN_OUTCOME" = success ] || [ "$RUN_OUTCOME" = skipped ] ||
              { [ -f "$out" ] && grep -q '"after row written"' "$out"; }; then
              echo "no install was touched; nothing to sweep"
              exit 0
            fi
            echo "::error::the install is unknown; revoke any owner token labelled ci-$GITHUB_RUN_ID: oa:hosted ci-token-sweep --install <id> --run $GITHUB_RUN_ID"
            exit 1
          fi
          [[ "$id" =~ ^i[a-z0-9]{11}$ ]] || { echo "::error::not an install id"; exit 1; }
          pnpm -s oa:hosted ci-token-sweep --env "$OPS_ENV" --install "$id" --run "$GITHUB_RUN_ID" | tee -a "$out"
      # The derived R2 and Turnstile files (OA_HOSTED_R2_FILE,
      # OA_HOSTED_TURNSTILE_FILE) and the token go, whatever happened.
      - name: Remove the token files
        if: ${{ always() }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/hosted-ops-secrets"
          rm -f "$d/r2" "$d/turnstile" "$d/token"
          rm -rf "$d" "$RUNNER_TEMP/hosted-ops-floor.sig.json"
          test ! -e "$d"
      # Audit: the CLI's actor is this run's URL; the summary lists each
      # step's JSON line (already redacted by the CLI).
      - name: Summary
        if: ${{ always() }}
        env:
          OPS_ENV: ${{ inputs.env }}
          OPS_OP: ${{ inputs.op }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hosted-ops-out.jsonl"
          {
            echo "### oa:hosted $OPS_OP ($OPS_ENV)"
            echo
            echo '```json'
            if [ -f "$out" ]; then cat "$out"; else echo "(no output)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
