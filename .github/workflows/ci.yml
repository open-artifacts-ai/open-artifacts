name: CI
on:
  pull_request:
  # Merge queue: the required checks run on the queue's merge commit.
  merge_group:
  # No push to main (#965): only the merge queue updates main, so every main
  # commit is a merge-group commit CI already passed. cache-seed.yml keeps the
  # install cache warm on main instead.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: version-consistency (package.json, release manifest, CHANGELOG)
        run: node --experimental-strip-types scripts/ci/version-consistency.ts
      - name: actionlint (runs shellcheck on run blocks)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          command -v shellcheck
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml
      - run: node --experimental-strip-types --no-warnings scripts/ci/workspace-reads.ts check --warn
      - run: node --experimental-strip-types --no-warnings scripts/ci/workspace-imports.ts cycles
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Fast path for release-please PRs: decided inside each job (a skipped or
      # missing job would count as passing a required check). The script comes from
      # the BASE commit, never from the code under test, and any error or any
      # output other than exactly "release-only" means full CI.
      - id: ro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          rel=false
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git show "$BASE_SHA:scripts/ci/release-only.ts" > "$RUNNER_TEMP/release-only.ts" 2> /dev/null \
            && out=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/release-only.ts" "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) \
            && [ "$out" = "release-only" ]; then
            rel=true
          fi
          echo "release_only=$rel" >> "$GITHUB_OUTPUT"
      - name: release-only change
        if: ${{ steps.ro.outputs.release_only == 'true' }}
        run: |
          echo "release-only change: skipped (the base commit is on main, which only the merge queue can update)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - run: pnpm typecheck
        if: ${{ steps.ro.outputs.release_only != 'true' }}
  # Three shards (one runner each, #965): the server suite, everything else
  # (with the root scripts suite), and the server's CPU budgets alone, so they
  # never run under another suite's load. The `test` job below is the required
  # check.
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one failure never hides another.
      fail-fast: false
      matrix:
        shard: [server, rest, cpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Fast path for release-please PRs: decided inside each job (a skipped or
      # missing job would count as passing a required check). The script comes from
      # the BASE commit, never from the code under test, and any error or any
      # output other than exactly "release-only" means full CI.
      - id: ro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          rel=false
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git show "$BASE_SHA:scripts/ci/release-only.ts" > "$RUNNER_TEMP/release-only.ts" 2> /dev/null \
            && out=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/release-only.ts" "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) \
            && [ "$out" = "release-only" ]; then
            rel=true
          fi
          echo "release_only=$rel" >> "$GITHUB_OUTPUT"
      - name: release-only change
        if: ${{ steps.ro.outputs.release_only == 'true' }}
        run: |
          echo "release-only change: skipped (the base commit is on main, which only the merge queue can update)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      # The server's B11/B13 dist integration tests serve the real render and
      # runtime builds; without them they skip (review item 45).
      - name: Build render and runtime for the dist integration tests
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        # @oa/shared first: both bundle it from its dist (`pnpm test` builds
        # it too, but only after this step).
        run: pnpm --filter @oa/shared build && pnpm --filter @oa/render --filter @oa/runtime build
      # This shard's share. Pull requests: only the packages the diff can
      # affect (pnpm --filter ...[base]; complete because every cross-package
      # import is declared, which the root suite checks). The script is the PR
      # head's copy: it can narrow only this PR's check. The merge queue (and a
      # dispatch) always runs every shard whole.
      - id: suite
        name: Tests (this shard; pull requests, affected packages only)
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_SHARD: ${{ matrix.shard }}
        run: bash scripts/ci/test-affected.sh
      # #1602: the Hermes plugin is Python, standard library only. Run in the
      # rest shard when bus-ipc or the plugin changed; the path filter is decided
      # here, never by a workflow `paths:` filter or a job `if:`, and any error in
      # the diff means run.
      - id: hermes
        name: Did bus-ipc or the Hermes plugin change?
        if: ${{ matrix.shard == 'rest' && steps.ro.outputs.release_only != 'true' }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          run=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "${BASE_SHA:-}" ] \
            && files="$(git diff --name-only "$BASE_SHA"...HEAD)" \
            && ! grep -qE '^(packages/bus-ipc/|packages/bus-adapter-hermes/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.ro.outputs.release_only != 'true' && steps.hermes.outputs.run == 'true' }}
        with:
          python-version: "3.11"
      - name: Hermes plugin tests
        if: ${{ steps.ro.outputs.release_only != 'true' && steps.hermes.outputs.run == 'true' }}
        run: python3 -m unittest discover -s packages/bus-adapter-hermes/tests
  # The required check (its name is branch protection's). Always runs, and
  # passes only when every shard passed: a skipped, cancelled or failed shard
  # fails it.
  test:
    needs: [test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "test-shard: $SHARDS"
          [ "$SHARDS" = success ]
  # P3 T16 (#605): the server authz matrix, in parallel with `test` so total
  # wall time drops. A required check; same release-only pattern as `test`.
  authz-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: ro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          rel=false
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git show "$BASE_SHA:scripts/ci/release-only.ts" > "$RUNNER_TEMP/release-only.ts" 2> /dev/null \
            && out=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/release-only.ts" "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) \
            && [ "$out" = "release-only" ]; then
            rel=true
          fi
          echo "release_only=$rel" >> "$GITHUB_OUTPUT"
      - name: release-only change
        if: ${{ steps.ro.outputs.release_only == 'true' }}
        run: |
          echo "release-only change: skipped (the base commit is on main, which only the merge queue can update)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - run: pnpm --filter @oa/server test:authz
        if: ${{ steps.ro.outputs.release_only != 'true' }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Fast path for release-please PRs: decided inside each job (a skipped or
      # missing job would count as passing a required check). The script comes from
      # the BASE commit, never from the code under test, and any error or any
      # output other than exactly "release-only" means full CI.
      - id: ro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          rel=false
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git show "$BASE_SHA:scripts/ci/release-only.ts" > "$RUNNER_TEMP/release-only.ts" 2> /dev/null \
            && out=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/release-only.ts" "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) \
            && [ "$out" = "release-only" ]; then
            rel=true
          fi
          echo "release_only=$rel" >> "$GITHUB_OUTPUT"
      - name: release-only change
        if: ${{ steps.ro.outputs.release_only == 'true' }}
        run: |
          echo "release-only change: skipped (the base commit is on main, which only the merge queue can update)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - run: pnpm build
        if: ${{ steps.ro.outputs.release_only != 'true' }}
  # Builds the real release bundle (buildBundle, dry run) and asserts it contains no
  # live test hooks. Same release-only fast path as the other jobs: never skipped
  # via needs/if, so it can be a required check.
  no-test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Fast path for release-please PRs: decided inside each job (a skipped or
      # missing job would count as passing a required check). The script comes from
      # the BASE commit, never from the code under test, and any error or any
      # output other than exactly "release-only" means full CI.
      - id: ro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          rel=false
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git show "$BASE_SHA:scripts/ci/release-only.ts" > "$RUNNER_TEMP/release-only.ts" 2> /dev/null \
            && out=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/release-only.ts" "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) \
            && [ "$out" = "release-only" ]; then
            rel=true
          fi
          echo "release_only=$rel" >> "$GITHUB_OUTPUT"
      - name: release-only change
        if: ${{ steps.ro.outputs.release_only == 'true' }}
        run: |
          echo "release-only change: skipped (the base commit is on main, which only the merge queue can update)"
          exit 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - name: Build the release bundle (buildBundle, dry run)
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        run: |
          pnpm --filter @oa/auth-core --filter @oa/bundle build
          pnpm --filter @oa/server run gen
          mkdir -p apps/server/dist-assets
          node --experimental-strip-types scripts/ci/build-release-bundle.ts "$RUNNER_TEMP/release-bundle"
      - name: No test hooks in the release bundle
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        run: pnpm check-no-test-hooks "$RUNNER_TEMP/release-bundle"
      - name: No red-line fake IdP in the release bundle
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        run: pnpm check-no-fake-idp "$RUNNER_TEMP/release-bundle"
      # P3 T17 (#602): builds the release and redline bundles itself and checks
      # the test-hook seeding is absent from release. OA_REQUIRE_REAL_BUILD
      # makes a missing build fail, never skip.
      - name: Test-hook strip test
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        env:
          OA_REQUIRE_REAL_BUILD: "1"
        run: pnpm --filter @oa/server exec vitest run -c vitest.node.config.ts test/node/test-hooks-strip.test.ts
  # No secrets: the real suite runs a local `wrangler dev` (ENVIRONMENT=dev in a
  # generated temp config), never staging. Four shards (one runner each, by spec
  # file); the `e2e` job below is the required check and merges their reports.
  e2e-shard:
    runs-on: ubuntu-latest
    # Browsers and their OS deps are baked into the image (no apt step: a slow
    # Ubuntu mirror cost three queue runs, #462). The tag must match
    # @oa/dashboard's @playwright/test; the digest pins the exact image.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      # Every shard reports, so one failure never hides another.
      fail-fast: false
      matrix:
        # The merge queue (and a dispatch) runs four shards: the full proof
        # before main. Pull requests run two: on the free plan's 20
        # concurrent jobs, two or three four-shard runs filled the cap and
        # bursts took 28-34 min (#965). A shard of four is about 7 min.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1,2]' || '[1,2,3,4]') }}
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.1
      E2E_SHARD: ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 4 }}
    # A shard of four well under 10 min (15 allowed); a pull request's shard of
    # two does about twice the work (25 allowed).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 15 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Fast path for release-please PRs: decided inside each job (a skipped or
      # missing job would count as passing a required check). The script comes from
      # the BASE commit, never from the code under test, and any error or any
      # output other than exactly "release-only" means full CI.
      - id: ro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          rel=false
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git show "$BASE_SHA:scripts/ci/release-only.ts" > "$RUNNER_TEMP/release-only.ts" 2> /dev/null \
            && out=$(node --experimental-strip-types --no-warnings "$RUNNER_TEMP/release-only.ts" "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) \
            && [ "$out" = "release-only" ]; then
            rel=true
          fi
          echo "release_only=$rel" >> "$GITHUB_OUTPUT"
      - name: release-only change
        if: ${{ steps.ro.outputs.release_only == 'true' }}
        run: |
          echo "release-only change: skipped (the base commit is on main, which only the merge queue can update)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - id: pw
        run: bash scripts/ci/e2e.sh version
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - id: install
        run: bash scripts/ci/e2e.sh install
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - run: bash scripts/ci/e2e.sh hosts
        if: ${{ steps.ro.outputs.release_only != 'true' }}
      - name: Mock suite
        if: ${{ steps.ro.outputs.release_only != 'true' }}
        run: bash scripts/ci/e2e.sh mock
      # Runs even when the mock suite failed (not when the browsers didn't install).
      - name: Real-server suite (local wrangler dev)
        if: ${{ !cancelled() && steps.ro.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh real
      # One spec on its own server: whole, in exactly one shard per event
      # (shard 3 of four in the queue, the lightest real share; shard 2 of two
      # on a pull request, since shard 1 carries ui and landing).
      - name: Real-server suite with spaces on (local wrangler dev)
        if: ${{ !cancelled() && matrix.shard == (github.event_name == 'pull_request' && 2 || 3) && steps.ro.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh spaces
      # Not sharded (about a minute together): shard 1 only.
      - name: UI real-browser checks (axe contrast, focus)
        if: ${{ !cancelled() && matrix.shard == 1 && steps.ro.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh ui
      - name: Landing real-browser checks (no horizontal overflow)
        if: ${{ !cancelled() && matrix.shard == 1 && steps.ro.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh landing
      - if: ${{ !cancelled() && steps.ro.outputs.release_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/dashboard/blob-report
          if-no-files-found: ignore
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 14
  # The required check (its name is branch protection's). Always runs, and passes
  # only when every shard passed: a skipped, cancelled or failed shard fails it.
  e2e:
    needs: [e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard: $SHARDS"
          [ "$SHARDS" = success ]
      # The merged html report, also when a shard failed (that's when it's read).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        if: ${{ !cancelled() }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !cancelled() }}
        id: blobs
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: apps/dashboard/blob-report
          merge-multiple: true
      - id: any
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(find apps/dashboard/blob-report -name '*.zip' 2> /dev/null)" ]; then
            echo "blobs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !cancelled() && steps.any.outputs.blobs == 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() && steps.any.outputs.blobs == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ !cancelled() && steps.any.outputs.blobs == 'true' }}
        run: pnpm install --frozen-lockfile --filter @oa/dashboard...
      - name: Merge the shards' reports
        if: ${{ !cancelled() && steps.any.outputs.blobs == 'true' }}
        run: bash scripts/ci/e2e.sh merge
      - if: ${{ !cancelled() && steps.any.outputs.blobs == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 14
  # #1213: times every migration newer than the last release against a large
  # synthetic database (100k users, 1M audit rows) and fails at 3 s or more
  # for any one (D1 stops a query at 30 s). Not a required check. The path
  # filter is decided inside the job, never by a workflow `paths:` filter or
  # a job `if:` (a filtered-out workflow leaves a required check pending
  # forever), so the job always reports and could be made required as is:
  # with no migration or seeder change it passes in seconds. Any error in the
  # diff means run. No pnpm install: node:sqlite and git only.
  migration-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Did a migration or the seeder change?
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          run=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "${BASE_SHA:-}" ] \
            && files="$(git diff --name-only "$BASE_SHA"...HEAD)" \
            && ! grep -qE '^(apps/server/migrations/|apps/server/scripts/migration-(seed|timing)\.ts$|apps/server/test/node/migration-seed\.test\.ts$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "no migration or seeder change: nothing to time"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.changed.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
      - id: key
        if: ${{ steps.changed.outputs.run == 'true' }}
        run: |
          key="$(node --experimental-strip-types --no-warnings apps/server/scripts/migration-timing.ts --key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # Keyed on the release's migration blobs and the seeder's hash; main's
      # copy comes from migration-seed.yml.
      - id: restore
        if: ${{ steps.changed.outputs.run == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/oa-migration-seed
          key: ${{ steps.key.outputs.key }}
      - name: Time the new migrations
        if: ${{ steps.changed.outputs.run == 'true' }}
        run: node --experimental-strip-types --no-warnings apps/server/scripts/migration-timing.ts --seed-file "$HOME/.cache/oa-migration-seed/seed.sqlite"
      # Saved even when a migration was too slow: the key file is written only
      # after a complete seed.
      - id: seeded
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' && steps.restore.outputs.cache-hit != 'true' }}
        run: |
          if [ -f "$HOME/.cache/oa-migration-seed/seed.sqlite.key" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.seeded.outputs.save == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/oa-migration-seed
          key: ${{ steps.key.outputs.key }}
  # Not a required check: skipped unless a release-config file changed.
  release-dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qxE 'release-please-config\.json|\.release-please-manifest\.json|\.github/workflows/release-please\.yml|biome\.json|CHANGELOG\.md'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # release-please 17.3.0 = version locked by googleapis/release-please-action v4.4.1 (package-lock.json)
      - if: steps.changed.outputs.run == 'true'
        env:
          RD_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/rp" release-please@17.3.0
          RELEASE_PLEASE="$RUNNER_TEMP/rp/node_modules/.bin/release-please" bash scripts/ci/release-dry-run.sh
  # #1056 untangle D: the public code installs, builds, typechecks and tests
  # with every private path (scripts/ci/private-paths.txt) removed.
  # Not a required check, and nothing needs it. It runs on the merge queue and
  # on dispatch. On a pull request it runs only when the PR changes scripts/ci/,
  # scripts/test/ or this workflow (#2254), the paths whose breakage shows up only here: the
  # decision is made inside the job, like migration-timing, so a PR that
  # touches neither passes in seconds. It does not block a merge: a red run is
  # a signal to fix, not a gate. A PR that brings back a listed private path is
  # still refused at the next cloud pin bump.
  public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Is this a PR that skips public-only?
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            run=false
            if [ -z "${BASE_SHA:-}" ] || ! files="$(git diff --name-only "$BASE_SHA"...HEAD)" \
              || grep -qE '^(scripts/ci/|scripts/test/|\.github/workflows/ci\.yml$)' <<< "$files"; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "no scripts/ci or scripts/test change: public-only not needed on this PR"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.changed.outputs.run == 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.changed.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ steps.changed.outputs.run == 'true' }}
        run: bash scripts/ci/public-only.sh
