name: release-cadence
# Puts the release-please PR at the front of the merge queue as soon as it is
# green (GraphQL enqueuePullRequest with jump: true), and keeps one `blocker`
# issue open while a release is stuck. No wait for the queue to drain and no
# cap: code PRs already queued, or queued later, go into the next release. A
# manual cut still works: queue the release PR yourself at any time.
on:
  # Events only, no timer (cloud #264). Every change that can make the release
  # PR ready is an event here:
  # - CI completing: the release PR's own checks (CI is the only workflow it
  #   needs), so it is queued the moment it goes green. Any event (another
  #   PR's CI too) looks up the release head's newest completed CI run by SHA,
  #   so a release CI event replaced in the one-slot concurrency queue is
  #   recovered by the next event.
  # - release-please completing: the release PR was opened or got a new head,
  #   or a release shipped (closes a stale blocker).
  # (check_suite does not fire for Actions suites, so workflow_run stands in.)
  workflow_dispatch:
  workflow_run:
    workflows: [release-please, CI]
    types: [completed]
permissions: {}
concurrency:
  group: release-cadence
  cancel-in-progress: false
jobs:
  cadence:
    # The real repository only: a fork's push to its own main does nothing.
    if: ${{ github.repository == 'open-artifacts-ai/open-artifacts' }}
    runs-on: ubuntu-latest
    permissions:
      # actions: read lists the release head's CI runs on every event.
      actions: read
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Read-only: does the release PR need to be queued at all? It fails, and
      # says why in the run summary, when the release PR's versions disagree
      # or are not above the latest tag.
      - id: plan
        name: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/release-cadence.ts plan --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      # The App token exists only right before queueing, scoped to the PR merge:
      # a merge started with GITHUB_TOKEN would trigger no workflows on the
      # merge commit.
      - id: app
        if: ${{ steps.plan.outputs.write == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write
      - name: arm
        if: ${{ steps.plan.outputs.write == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Reads (the PR, its CI runs, versions, tags) use the job token; only
          # the enqueue uses the App token.
          READ_GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/release-cadence.ts arm --repo "$GITHUB_REPOSITORY"
      - name: blocker
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/release-cadence.ts blocker --repo "$GITHUB_REPOSITORY"
