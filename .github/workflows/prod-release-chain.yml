# The automatic prod release chain (#1343). When a red-line run passes for an
# exact release tag, the chain deploys that tag to the prod platform with no
# human step; the scheduler's fleet duty (#955) then upgrades the canary, leo
# and the rest, each soaking first (apps/scheduler/src/provapi/fleet.ts).
# Forward only: nothing here rolls back. docs/ops/hosted.md has the halts and
# how one clears.
#
# Off until reviewed: the gate runs only with the repo variable
# PROD_RELEASE_CHAIN set to "on". The fleet has its own switch, prod's
# FLEET_CANARY in apps/scheduler/wrangler.jsonc.
#
# The only trigger is a completed redline-staging run that concluded success
# and was dispatched (the nightly calls it, so its runs never count). The tag
# comes only from that run's display title (redline-staging.yml's run-name),
# through env, never into a script. Then main's own scripts prove it again:
# staging-first-gate.sh, staging-smoke-gate.sh (#1406: staging's post-deploy
# smoke is green at or after the tag) and tag-passed-checks.sh prod (a
# failure is red).
# Then two checks that skip, green with a notice, without touching the
# blocker issue: this event is the newest green run for the tag (else it is
# stale), and the tag is newer than the release prod's scheduler runs (else
# prod already has it). The deploy is deploy-hosted-platform.yml itself, as a
# workflow_call with env prod and every target, so all its gates and the
# platform-tags.sh read-back run unchanged, and its concurrency group
# serializes the chain against a manual deploy; require_newer re-checks the
# tag against prod once the call holds that group, so a manual deploy of a
# newer tag is never downgraded. The scheduler deploys last there, so a run
# that stops partway never moves the fleet. A red chain run keeps one
# `blocker` issue open; a green one closes it.
name: prod-release-chain

on:
  workflow_run:
    workflows: [redline-staging]
    types: [completed]

permissions: {}

concurrency:
  group: prod-release-chain
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ vars.PROD_RELEASE_CHAIN == 'on' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # The prod deploy token, for one read: the scheduler's release tag.
    environment: hosted-prod-deploy
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # "true" only when this event is fresh and the tag is newer than prod's.
      go: ${{ steps.fresh.outputs.go == 'true' && steps.newer.outputs.go == 'true' }}
    steps:
      # workflow_run runs on the default branch; refuse anything else.
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "the chain runs on main only"; exit 1; }'
      # main's scripts and constants only.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
            .github/hosted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The run's title is the only source of the tag, checked against
      # redline-staging.yml's run-name before anything uses it.
      - id: tag
        name: The tag, from the red-line run's name
        env:
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts tag --title "$TITLE" >> "$GITHUB_OUTPUT"
      - name: Staging passed this tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/staging-first-gate.sh "$TAG"
      # #1406: and staging's post-deploy smoke is green at or after the tag.
      - name: Staging's smoke is green at or after this tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/staging-smoke-gate.sh "$TAG"
      - name: The tag passed every earlier check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tag-passed-checks.sh prod "$TAG"
      # A stale event (a newer green run for the tag) skips: that run's own
      # event acts instead.
      - id: fresh
        name: This event is the newest green run for the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go="$(node --experimental-strip-types scripts/ci/prod-release-chain.ts fresh --repo "$GITHUB_REPOSITORY" --tag "$TAG" --head-sha "$HEAD_SHA")"
          printf '%s\n' "$go" >> "$GITHUB_OUTPUT"
          [ "$go" = go=true ] || echo "::notice title=Release chain skipped::a newer green red-line run for $TAG exists; this event is stale"
      - name: Load the hosted constants
        if: steps.fresh.outputs.go == 'true'
        run: bash scripts/ci/hosted-constants.sh prod .github/hosted > /dev/null
      # A release prod already runs (a repeated red-line, a re-run) skips.
      - id: newer
        name: The tag is newer than prod's
        if: steps.fresh.outputs.go == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          current="$(bash scripts/ci/worker-tag.sh prod scheduler)"
          go="$(node --experimental-strip-types scripts/ci/prod-release-chain.ts newer --tag "$TAG" --current "$current")"
          printf '%s\n' "$go" >> "$GITHUB_OUTPUT"
          [ "$go" = go=true ] || echo "::notice title=Release chain skipped::prod already runs $current; $TAG is not newer"
  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/deploy-hosted-platform.yml
    with:
      env: prod
      tag: ${{ needs.gate.outputs.tag }}
      targets: "platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler"
      reason: ""
      verify_only: false
      require_newer: true
    # Every secret the called job reads is passed by name, never `inherit`.
    # GitHub resolves a secret the caller does not pass to an empty string,
    # even when the called job's Environment (hosted-prod-deploy) has it. A
    # passed name is overridden by the Environment's value of the same name
    # inside that job, so prod's values win; the caller's own (repo-level)
    # value is only a fallback if the Environment lacks the secret. See
    # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
    secrets:
      OA_OWNER_EMAIL: ${{ secrets.OA_OWNER_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DIRECTORY_CLIENT_SECRET: ${{ secrets.GOOGLE_DIRECTORY_CLIENT_SECRET }}
      ADMIN_IDENTITIES: ${{ secrets.ADMIN_IDENTITIES }}
      FLEET_SMOKE_TOKEN: ${{ secrets.FLEET_SMOKE_TOKEN }}
      FLEET_SMOKE_SHARE_TO: ${{ secrets.FLEET_SMOKE_SHARE_TO }}
  report:
    needs: [gate, deploy]
    if: ${{ always() && vars.PROD_RELEASE_CHAIN == 'on' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Keep the blocker issue in step
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          # A failed gate is reported too: the chain never fails quietly. A
          # skip (go false) leaves deploy "skipped", which leaves the issue.
          RESULT: ${{ needs.gate.result == 'success' && needs.deploy.result || needs.gate.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts report --repo "$GITHUB_REPOSITORY" --tag "$TAG" --result "$RESULT" --run "$RUN"
