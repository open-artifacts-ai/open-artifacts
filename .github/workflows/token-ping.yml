name: Ops - token ping
# Pings exactly one Cloudflare token so its "Last used" time moves on the
# dashboard (#933, #934). Manual, from main only. Prints the token's id and
# status, never its value. One job per choice; each references one secret.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which token to ping (location/SECRET)
        type: choice
        required: true
        options:
          - hosted-staging-deploy/CLOUDFLARE_API_TOKEN
          - repo/CLOUDFLARE_API_TOKEN
          - repo/ANALYTICS_TOKEN
          - redline-staging/REDLINE_PROD_SCRIPTS_TOKEN
          - redline-staging/REDLINE_PROD_R2_TOKEN
permissions:
  contents: read
jobs:
  hosted-staging-deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && inputs.target == 'hosted-staging-deploy/CLOUDFLARE_API_TOKEN'
    runs-on: ubuntu-latest
    environment: hosted-staging-deploy
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh staging

  repo-cloudflare:
    if: github.ref == 'refs/heads/main' && inputs.target == 'repo/CLOUDFLARE_API_TOKEN'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh staging

  repo-analytics:
    if: github.ref == 'refs/heads/main' && inputs.target == 'repo/ANALYTICS_TOKEN'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh staging

  redline-staging-scripts:
    if: github.ref == 'refs/heads/main' && inputs.target == 'redline-staging/REDLINE_PROD_SCRIPTS_TOKEN'
    runs-on: ubuntu-latest
    environment: redline-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.REDLINE_PROD_SCRIPTS_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh staging

  redline-staging-r2:
    if: github.ref == 'refs/heads/main' && inputs.target == 'redline-staging/REDLINE_PROD_R2_TOKEN'
    runs-on: ubuntu-latest
    environment: redline-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.REDLINE_PROD_R2_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh staging
