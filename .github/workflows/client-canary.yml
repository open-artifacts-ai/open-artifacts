# The client canary (agy S7): do the real bus clients still work end to end?
# Each job installs one real client (the pinned release nightly, the latest
# release weekly) and an `oa-bus` built from this commit, points it at rl-a,
# the STAGING install with test hooks, as a new member signed in through its
# session hook, approves its machines on the real approval page, and checks that the client
# joins the bus at start, answers a message, takes a message sent mid-turn
# (in that turn for Codex and Pi; at the start of the next turn for Claude
# Code and OpenCode, which have no steer path), has habits on, and that a page
# it publishes shows as that session. scripts/canary/README.md has the details.
#
# - Never on pull_request: it spends model tokens. Nightly, weekly, or by hand.
# - A client whose model key or staging secret is missing FAILS, with a summary
#   line naming the secret, and the report job alerts as for any failure.
# - One job per client, plus one report job: five jobs, far under the 180 cap.
#   Each job has its own member and machines, so they run side by side.
# - Each job gets only its own client's model key; npm gets no secret.
# - The canary jobs get contents: read only. The report job has no model key:
#   it reads the result files and keeps ONE issue per client (label
#   client-canary), with each channel's result in it, as release-alert.yml
#   keeps its blocker. It closes once every channel has passed.
# - Credentials never outlive a job: the canary deletes its token, bus home,
#   machine file and scratch HOME on every way out, and erases its staging
#   member; a cleanup step under always() does it again for a job cut off by
#   its timeout or a cancel.
name: client-canary

on:
  schedule:
    # Nightly, the pinned client releases.
    - cron: "30 3 * * *"
    # Weekly (Monday), each client's latest release, to catch upstream changes.
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      channel:
        description: Which client releases to run
        type: choice
        options: [pinned, latest]
        default: pinned

permissions: {}

concurrency:
  group: client-canary
  cancel-in-progress: false

env:
  CHANNEL: ${{ github.event.schedule == '30 4 * * 1' && 'latest' || inputs.channel || 'pinned' }}
  # The scheduled target. A local server is for development only (README).
  CANARY_TARGET: staging
  # Optional: another staging test-hooks install and its TEST_DOMAIN; empty
  # means rl-a (https://rl-a.open-artifacts-staging.app, oa-redline-a.fyi).
  CANARY_STAGING_URL: ${{ vars.CANARY_STAGING_URL }}
  CANARY_STAGING_TEST_DOMAIN: ${{ vars.CANARY_STAGING_TEST_DOMAIN }}
  # This run's id: in each member's address, token label and page title, so
  # every check is bound to this run, and the cleanup step finds its member.
  CANARY_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        client: [claude, codex, opencode, pi]
    env:
      CLIENT: ${{ matrix.client }}
      RESULT: canary-${{ matrix.client }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: A scratch temp folder the cleanup step deletes
        run: |
          mkdir -p "$RUNNER_TEMP/canary-scratch"
          echo "TMPDIR=$RUNNER_TEMP/canary-scratch" >> "$GITHUB_ENV"
      - id: need
        name: Are this client's secrets set? (a missing one fails the job)
        env:
          # Only this leg's client gets its key (scripts/canary/clients.ts secrets).
          ANTHROPIC_API_KEY: ${{ contains(fromJSON('["claude","opencode","pi"]'), matrix.client) && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ contains(fromJSON('["codex"]'), matrix.client) && secrets.OPENAI_API_KEY || '' }}
          # rl-a's test hook key: signs in the run's member (README).
          CANARY_RL_A_HOOK_KEY: ${{ secrets.CANARY_RL_A_HOOK_KEY }}
        run: node --experimental-strip-types --no-warnings scripts/canary/run.ts --check --client "$CLIENT" --channel "$CHANNEL" --out "$RESULT"
      - if: steps.need.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.need.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.need.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build oa-bus
        if: steps.need.outputs.run == 'true'
        run: pnpm --filter @open-artifacts/bus build
      - name: Run the canary
        if: steps.need.outputs.run == 'true'
        env:
          # Only this leg's client gets its key (scripts/canary/clients.ts secrets).
          ANTHROPIC_API_KEY: ${{ contains(fromJSON('["claude","opencode","pi"]'), matrix.client) && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ contains(fromJSON('["codex"]'), matrix.client) && secrets.OPENAI_API_KEY || '' }}
          # rl-a's test hook key: signs in the run's member (README).
          CANARY_RL_A_HOOK_KEY: ${{ secrets.CANARY_RL_A_HOOK_KEY }}
          # Optional repo variables; empty means the client's own cheap default.
          CANARY_MODEL_CLAUDE: ${{ vars.CANARY_MODEL_CLAUDE }}
          CANARY_MODEL_CODEX: ${{ vars.CANARY_MODEL_CODEX }}
          CANARY_MODEL_OPENCODE: ${{ vars.CANARY_MODEL_OPENCODE }}
          CANARY_MODEL_PI: ${{ vars.CANARY_MODEL_PI }}
        run: node --experimental-strip-types --no-warnings scripts/canary/run.ts --client "$CLIENT" --channel "$CHANNEL" --out "$RESULT" --logs "$RUNNER_TEMP/canary-logs"
      - name: Record a job that broke before the canary ran
        # cancelled(): a job cut off by timeout-minutes ends cancelled, not failed.
        if: failure() || cancelled()
        run: node --experimental-strip-types --no-warnings scripts/canary/run.ts --client "$CLIENT" --channel "$CHANNEL" --out "$RESULT" --mark-failed "the job stopped before the canary finished (a setup or build step failed, or it timed out). See the run"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-${{ matrix.client }}
          path: ${{ env.RESULT }}
          if-no-files-found: ignore
          retention-days: 14
      # The client, daemon and install logs of a failed run, with every secret
      # value and every token shape (oa_machine_, oa_pat_, sk-) blanked.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.client }}
          path: ${{ runner.temp }}/canary-logs
          if-no-files-found: ignore
          retention-days: 14
      # Every way out, a cancel and a timeout too: erase this run's staging
      # member (its token, machines and pages) and delete the scratch HOME,
      # bus home and machine file, in case the canary was cut off.
      - name: Clean up credentials
        if: always()
        env:
          CANARY_RL_A_HOOK_KEY: ${{ secrets.CANARY_RL_A_HOOK_KEY }}
        run: |
          node --experimental-strip-types --no-warnings scripts/canary/run.ts --cleanup --client "$CLIENT"
          rm -rf "$RUNNER_TEMP/canary-scratch" "$RUNNER_TEMP/canary-logs"

  report:
    needs: [canary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/canary
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: canary-*
          path: ${{ runner.temp }}/canary-results
      - name: One issue per client
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The owner's GitHub login, @-mentioned on a failure (as the staging smoke alert).
          NOTIFY: ${{ vars.OA_ALERT_GITHUB_LOGIN }}
        run: node --experimental-strip-types --no-warnings scripts/canary/report.ts "$RUNNER_TEMP/canary-results"
