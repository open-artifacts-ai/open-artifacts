# The client canary (agy S7): do the real bus clients still work end to end?
# Each job installs one real client (the pinned release nightly, the latest
# release weekly), runs a LOCAL Open Artifacts server (`wrangler dev`, no
# staging, no secret) and an `oa-bus` built from this commit, and checks that
# the client joins the bus at start, answers a message, takes a message sent
# mid-turn in that turn (where it can), has habits on, and that a page it
# publishes shows as that session. scripts/canary/README.md has the details.
#
# - Never on pull_request: it spends model tokens. Nightly, weekly, or by hand.
# - Only model API keys are secrets. A client whose key is missing is skipped
#   with a summary line saying which secret to add, and its job stays green.
# - One job per client, plus one report job: five jobs, far under the 180 cap.
# - The canary jobs get contents: read only. The report job has no checkout
#   and no model key: it reads the result files and keeps one issue per
#   client (label client-canary), as release-alert.yml keeps its blocker.
name: client-canary

on:
  schedule:
    # Nightly, the pinned client releases.
    - cron: "30 3 * * *"
    # Weekly (Monday), each client's latest release, to catch upstream changes.
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      channel:
        description: Which client releases to run
        type: choice
        options: [pinned, latest]
        default: pinned

permissions: {}

concurrency:
  group: client-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        client: [claude, codex, opencode, pi]
    env:
      CLIENT: ${{ matrix.client }}
      CHANNEL: ${{ github.event.schedule == '30 4 * * 1' && 'latest' || inputs.channel || 'pinned' }}
      RESULT: canary-${{ matrix.client }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: need
        name: Is this client's model key set?
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node --experimental-strip-types --no-warnings scripts/canary/run.ts --check --client "$CLIENT" --channel "$CHANNEL" --out "$RESULT"
      - if: steps.need.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.need.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.need.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the server and oa-bus
        if: steps.need.outputs.run == 'true'
        run: |
          pnpm --filter @oa/server build
          pnpm --filter @open-artifacts/bus build
      - name: Run the canary
        if: steps.need.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional repo variables; empty means the client's own cheap default.
          CANARY_MODEL_CLAUDE: ${{ vars.CANARY_MODEL_CLAUDE }}
          CANARY_MODEL_CODEX: ${{ vars.CANARY_MODEL_CODEX }}
          CANARY_MODEL_OPENCODE: ${{ vars.CANARY_MODEL_OPENCODE }}
          CANARY_MODEL_PI: ${{ vars.CANARY_MODEL_PI }}
        run: node --experimental-strip-types --no-warnings scripts/canary/run.ts --client "$CLIENT" --channel "$CHANNEL" --out "$RESULT"
      - name: Record a job that broke before the canary ran
        if: failure()
        run: node --experimental-strip-types --no-warnings scripts/canary/run.ts --client "$CLIENT" --channel "$CHANNEL" --out "$RESULT" --mark-failed "the job failed before the canary finished in setup or build. See the run"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-${{ matrix.client }}
          path: ${{ env.RESULT }}
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [canary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/canary
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: canary-*
          path: ${{ runner.temp }}/canary-results
      - name: One issue per client
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types --no-warnings scripts/canary/report.ts "$RUNNER_TEMP/canary-results"
