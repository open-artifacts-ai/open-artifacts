name: Ops - deploy demo ops worker
# Deploys apps/demo-ops (cron Worker that feeds the demo dashboard). Dispatch only, from main,
# staging-scoped Cloudflare credentials plus the demo PAT; never a PROD secret.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-ops-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oa/demo-ops test
      - run: pnpm --filter @oa/shared build
      - name: Map ops/demo/ids.json to the worker's id vars
        run: node --experimental-strip-types apps/demo-ops/scripts/vars.ts ops/demo/ids.json > "$RUNNER_TEMP/demo-vars"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=()
          while IFS= read -r kv; do args+=(--var "$kv"); done < "$RUNNER_TEMP/demo-vars"
          pnpm --filter @oa/server exec wrangler deploy -c ../demo-ops/wrangler.jsonc "${args[@]}"
      - name: Set DEMO_OA_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_OA_TOKEN: ${{ secrets.DEMO_OA_TOKEN }}
        run: printf '%s' "$DEMO_OA_TOKEN" | pnpm --filter @oa/server exec wrangler secret put DEMO_OA_TOKEN -c ../demo-ops/wrangler.jsonc
