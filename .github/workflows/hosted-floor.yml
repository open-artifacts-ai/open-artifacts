name: hosted-floor
# T3b H1: sign an env's release floor (releases/floor.json) with that env's
# release key, which exists only in the GitHub Environment hosted-<env>. The
# signed file is a workflow artifact (never a release asset); publishFloor
# (on a laptop, provisioning token) verifies it and writes it to R2.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Env whose floor to sign
        required: true
        type: choice
        options: [staging, prod]
      seq:
        description: The new floor seq (above the current one, >= FLOOR_MIN_SEQ)
        required: true
        type: string
      min_version:
        description: The oldest version create may install (X.Y.Z)
        required: true
        type: string
      revoked:
        description: Comma-separated revoked versions (keep every earlier entry); empty for none
        required: false
        default: ""
        type: string
permissions: {}
jobs:
  floor-guard:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Resolve main's branch SHA (the commit whose scripts sign)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read main"; exit 1; }
          [ "$main_sha" = "$RUN_SHA" ] || { echo "main moved ($main_sha) since this run started at $RUN_SHA; dispatch again"; exit 1; }
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
  hosted-floor:
    needs: [floor-guard]
    runs-on: ubuntu-latest
    environment: hosted-${{ inputs.env }}
    permissions:
      contents: read
    concurrency:
      group: hosted-floor-${{ inputs.env }}
      cancel-in-progress: false
    outputs:
      floor_signature: ${{ steps.sign.outputs.floor_signature }}
      floor_record_sha256: ${{ steps.sign.outputs.floor_record_sha256 }}
    # Exactly these steps: no install, node:* imports only.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.floor-guard.outputs.sha }}
          persist-credentials: false
      # Decision 4 (Manager review), H-N22: Node 22 from .nvmrc via setup-node
      # pinned by SHA, no cache; plain .mjs, no strip-types. The key is only in
      # the sign step's env.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Assert Node 22
        run: v=$(node --version); case "$v" in v22.*) ;; *) echo "expected Node 22, got $v" >&2; exit 1;; esac
      - id: sign
        name: Sign the floor (the key goes in on stdin only)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          FLOOR_ENV: ${{ inputs.env }}
          FLOOR_SEQ: ${{ inputs.seq }}
          FLOOR_MIN: ${{ inputs.min_version }}
          FLOOR_REVOKED: ${{ inputs.revoked }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_KEY" | node scripts/ci/sign-floor.mjs --env "$FLOOR_ENV" --seq "$FLOOR_SEQ" --min-version "$FLOOR_MIN" --revoked "$FLOOR_REVOKED" --out "$RUNNER_TEMP/floor" >> "$GITHUB_OUTPUT"
  hosted-floor-upload:
    needs: [floor-guard, hosted-floor]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.floor-guard.outputs.sha }}
          persist-credentials: false
      # Rebuilt from the same inputs; refused unless the record hashes to what
      # hosted-floor signed and the signature verifies (pinned key).
      - name: Rebuild the signed floor file (no key)
        env:
          FLOOR_ENV: ${{ inputs.env }}
          FLOOR_SEQ: ${{ inputs.seq }}
          FLOOR_MIN: ${{ inputs.min_version }}
          FLOOR_REVOKED: ${{ inputs.revoked }}
          SIGNATURE: ${{ needs.hosted-floor.outputs.floor_signature }}
          RECORD_SHA256: ${{ needs.hosted-floor.outputs.floor_record_sha256 }}
        run: |
          set -euo pipefail
          node scripts/ci/sign-floor.mjs --assemble --env "$FLOOR_ENV" --seq "$FLOOR_SEQ" --min-version "$FLOOR_MIN" --revoked "$FLOOR_REVOKED" --signature "$SIGNATURE" --record-sha256 "$RECORD_SHA256" --out "$RUNNER_TEMP/floor"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: floor-${{ inputs.env }}-${{ inputs.seq }}
          path: ${{ runner.temp }}/floor/floor-${{ inputs.env }}-${{ inputs.seq }}.sig.json
          if-no-files-found: error
          retention-days: 30
