name: Ops - token ping (prod)
# Pings exactly one Cloudflare token so its "Last used" time moves on the
# dashboard (#933, #934). Manual, from main only. Prints the token's id and
# status, never its value. One job per choice; each references one secret.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which token to ping (location/SECRET)
        type: choice
        required: true
        options:
          - hosted-prod-deploy/CLOUDFLARE_API_TOKEN
          - repo/PROD_CLOUDFLARE_API_TOKEN
permissions:
  contents: read
jobs:
  hosted-prod-deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && inputs.target == 'hosted-prod-deploy/CLOUDFLARE_API_TOKEN'
    runs-on: ubuntu-latest
    environment: hosted-prod-deploy
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh prod

  repo-prod-cloudflare:
    if: github.ref == 'refs/heads/main' && inputs.target == 'repo/PROD_CLOUDFLARE_API_TOKEN'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - name: Ping the token (prints its id and status only)
        env:
          TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          HOSTED_DIR: .github/hosted
        run: bash scripts/ci/token-ping.sh prod
