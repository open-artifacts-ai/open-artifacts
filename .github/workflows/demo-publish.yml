name: Demo publish
# Publishes the approved demo artifacts (ops/demo/publish.json) to demo.open-artifacts.com.
# Off until the repository variable DEMO_ENABLED is 'true'. The demo's own PAT only.
# Only a dispatch with create=true creates artifacts (then the run fails: commit ops/demo/ids.json
# with the NEW ids); push runs never do.
on:
  push:
    branches: [main]
    paths: ["ops/demo/**"]
  workflow_dispatch:
    inputs:
      create:
        description: Create artifacts for slugs with no id in ops/demo/ids.json (then commit ids.json)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: demo-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.DEMO_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Write the PAT file
        env:
          DEMO_OA_TOKEN: ${{ secrets.DEMO_OA_TOKEN }}
        run: |
          umask 077
          printf '%s' "$DEMO_OA_TOKEN" > "$RUNNER_TEMP/pat"
      - name: Publish the approved artifacts
        env:
          # Push runs never create artifacts: only a dispatch with create=true does.
          CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.create && 'true' || 'false' }}
        run: |
          args=()
          if [ "$CREATE" = true ]; then args+=(--create); fi
          node --experimental-strip-types scripts/demo/publish.ts \
            --base-url https://demo.open-artifacts.com \
            --token-file "$RUNNER_TEMP/pat" "${args[@]}" --apply
      - name: Check healthz
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://demo.open-artifacts.com/healthz
      - name: Remove the PAT file
        if: always()
        run: rm -f "$RUNNER_TEMP/pat"
