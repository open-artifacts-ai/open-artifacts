name: Ops - production first install
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (e.g. v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prod
  cancel-in-progress: false
env:
  PROD_NAME: open-artifacts-prod
  PROD_APP_HOST: artifacts.leourbina.com
  PROD_CONTENT_HOST: artifacts-content.leourbina.com
  PROD_OWNER_EMAIL: me@leourbina.com
  # Direct sign-in (docs/self-hosting/direct-sign-in.md): repository
  # variables, read by prod-setup.sh from env. Unset keeps the live value.
  PROD_AUTH_PROVIDERS: ${{ vars.PROD_AUTH_PROVIDERS }}
  PROD_AUTH_DOMAINS: ${{ vars.PROD_AUTH_DOMAINS }}
  PROD_AUTH_DOMAIN_JOIN: ${{ vars.PROD_AUTH_DOMAIN_JOIN }}
  PROD_GOOGLE_CLIENT_ID: ${{ vars.PROD_GOOGLE_CLIENT_ID }}
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require latest stable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          latest=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
          gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null || { echo "tag $TAG does not exist"; exit 1; }
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is not the latest stable release ($latest)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run production setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          OA_ACCESS_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: bash scripts/ci/prod-setup.sh install
      - name: Revoke leaked setup-ci tokens
        if: always()
        continue-on-error: false
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          OA_ACCESS_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm -s oa:setup --ci --revoke-ci-tokens
          --name "$PROD_NAME" --app-host "$PROD_APP_HOST"
          --content-host "$PROD_CONTENT_HOST" --owner-email "$PROD_OWNER_EMAIL"
