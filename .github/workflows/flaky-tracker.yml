# The flaky tracker for public CI (cloud #447). Tracking only: it reruns
# nothing and blocks nothing. When a CI run passes on attempt 2 or later,
# every test that failed (or timed out) on an earlier attempt of that run
# (same commit) failed and then passed with nothing changed.
# scripts/ci/flaky-tracker.ts reads those attempts' failed job logs, records
# each sighting in the `flaky-sightings` store issue, and opens or bumps one
# issue labelled `flaky` per test once it was seen in two runs within 7 days.
# workflow_run can't see another repo's runs, so the cloud repo runs its own
# tracker for its CI. The default token only: no App, no secret, no
# Environment. The script comes from the default branch, never from the run
# under test. Runs from forks (a PR from another repo) count too: this job
# never checks out or runs a fork's code, and what their runs give it (logs
# and the test names in them) is only read as text and made inert before it
# is written to an issue.
# Hourly, a reconcile tracks any such run created in the last 30 days and
# 26 hours (GitHub allows a rerun for 30 days; the 26 hours keep a late
# rerun listed) and updated in the last 26 hours whose event
# this workflow missed; a run the store already has is skipped. A listing of
# 1,000 runs or more (GitHub's limit for one query) is split into smaller
# creation ranges, and the reconcile fails if one second still has that many. The watched
# workflow is named by its file (workflow_run.path), never by
# workflow_run.name: that is the run-name, which a workflow may set to
# anything (cloud's redline-staging runs are named "redline-staging v0.247.0").
name: flaky-tracker
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
permissions: {}
jobs:
  track:
    if: >-
      github.event_name == 'schedule' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1 &&
      github.event.workflow_run.path == '.github/workflows/ci.yml')
    # One group for every tracker run in this repo, so two runs never read
    # and write the store and the issues at once. It sits on the job, not the
    # workflow: every CI completion starts this workflow, and a skipped one
    # holding a workflow-level slot would cancel a pending real run. queue:
    # max keeps every pending run waiting in order instead of only the
    # newest, so no sighting is dropped (it can't go with cancel-in-progress
    # true); the hourly reconcile catches any run past the queue's limit.
    concurrency:
      group: flaky-tracker
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Record the flaky tests
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node --experimental-strip-types scripts/ci/flaky-tracker.ts --repo "$GITHUB_REPOSITORY" --run-id "$RUN_ID" --attempt "$ATTEMPT"
      - name: Reconcile the runs the event missed
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/flaky-tracker.ts --repo "$GITHUB_REPOSITORY" --reconcile
