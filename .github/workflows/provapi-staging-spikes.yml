# The Provisioning API's staging spikes S1-S8 (design v7 13.1 "Spikes",
# 14.4) and a read-only check of the staging CI token, by hand only, on
# main, in hosted-staging-deploy. Staging only: every constant comes from
# main's .github/hosted/staging.json and @oa/provision's names, and
# scripts/ci/provapi-spikes.sh refuses any that resolves to prod, and leo.
# rl-a and rl-b are only read (GETs).
#
# How each spike runs:
# - verify, s8, s6: Cloudflare REST GETs.
# - s4: Secrets Store REST: one throwaway secret oa-s-spike-<run> (value on
#   stdin, made in the job, never printed), metadata read back, deleted.
# - s1, s2, s3, s5, s7: two throwaway Workers with no route, workers.dev or
#   preview URL (spikes/provapi-staging): oa-s-spike-<run>-wf hosts Workflow
#   oa-s-spike-<run> (class SpikeWorkflow); oa-s-spike-<run> binds it
#   cross-script, the staging dispatch namespace and the throwaway D1
#   database oa-s-spike-<run>. deploy creates that database's results table
#   first; the caller writes a "started" row on every cron tick, runs the
#   spikes on its first and writes each result (a throw is an error row);
#   the job reads them back over the D1 REST API for up to 18 min, since a
#   new Cron Trigger can take up to 15 min to propagate (no fetch handler,
#   so nothing is reachable). A spike with no row names why: "D1 error:
#   <message>", "cron never fired", or "fired, no row for sN".
# Cleanup (always) deletes this run's Workers, Workflow, D1 database and
# secret, and any oa-s-spike-* left over from an earlier run (over 1 h old);
# it refuses any name without that prefix.
#
# Each spike step is continue-on-error, so one failure hides no other; the
# last step fails the run if any spike failed. One results file,
# spike-results.json (names, types, statuses and times; never a secret
# value), is uploaded, and the job summary has one line per spike.
#
# env=prod runs only the prod-verify job: the read-only token verify of
# scripts/ci/provapi-token-verify.sh (GETs only, no write helper), in
# hosted-prod-deploy, with prod.json's constants and oa-p-provision-token's
# metadata. The spikes list must be exactly "verify". The prod token never
# shares a job with provapi-spikes.sh, wrangler or any write.
name: provapi-staging-spikes

on:
  workflow_dispatch:
    inputs:
      env:
        description: "staging runs the spikes; prod runs only the read-only verify"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      spikes:
        description: "Comma list of verify,s1,s2,s3,s4,s5,s6,s7,s8"
        required: true
        default: "verify,s8,s6,s1,s2,s3,s4,s5,s7"
        type: string

permissions:
  contents: read

concurrency:
  group: provapi-spikes-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  spikes:
    if: ${{ github.ref == 'refs/heads/main' && inputs.env == 'staging' }}
    runs-on: ubuntu-latest
    environment: hosted-staging-deploy
    timeout-minutes: 45
    env:
      SPIKES: ${{ inputs.spikes }}
      RUN_ID: ${{ github.run_id }}
      HOSTED_DIR: ${{ github.workspace }}/.github/hosted
    steps:
      # The runner context is not available in job-level env, so the paths
      # under $RUNNER_TEMP are set here, for every later step.
      - name: Set the paths
        run: |
          set -euo pipefail
          {
            echo "TOKEN_FILE=$RUNNER_TEMP/cf-token"
            echo "RESULTS_DIR=$RUNNER_TEMP/spike-results"
            echo "RESULTS_OUT=$RUNNER_TEMP/spike-results.json"
            echo "STATE_DIR=$RUNNER_TEMP/spike-state"
          } >> "$GITHUB_ENV"
      - name: Check the inputs
        run: |
          set -euo pipefail
          IFS=, read -ra list <<< "$SPIKES"
          [ "${#list[@]}" -gt 0 ] || { echo "no spikes"; exit 1; }
          seen=""
          for t in "${list[@]}"; do
            case "$t" in verify | s1 | s2 | s3 | s4 | s5 | s6 | s7 | s8) ;; *) echo "unknown spike: $t"; exit 1 ;; esac
            case " $seen " in *" $t "*) echo "duplicate spike: $t"; exit 1 ;; esac
            seen="$seen $t"
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # @oa/provision's names (the rl-a, rl-b script names, the provisioning
      # token secret's name) are read from its built dist.
      - run: pnpm --filter @oa/provision build
      # The one secret: to a 0600 file, masked, never printed.
      - name: Write the Cloudflare token file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "the token secret is not set"; exit 1; }
          printf '::add-mask::%s\n' "$CLOUDFLARE_API_TOKEN"
          umask 077
          printf '%s' "$CLOUDFLARE_API_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          test "$(stat -c %a "$TOKEN_FILE")" = 600
      - name: verify (read-only)
        if: ${{ contains(format(',{0},', inputs.spikes), ',verify,') }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh verify
      - name: S8 (read-only)
        if: ${{ contains(format(',{0},', inputs.spikes), ',s8,') }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh s8
      - name: S6 (read-only)
        if: ${{ contains(format(',{0},', inputs.spikes), ',s6,') }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh s6
      - name: S4 (Secrets Store)
        if: ${{ contains(format(',{0},', inputs.spikes), ',s4,') }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh s4
      - name: Deploy the throwaway spike Workers (S1 S2 S3 S5 S7)
        id: deploy
        if: ${{ contains(format(',{0},', inputs.spikes), ',s1,') || contains(format(',{0},', inputs.spikes), ',s2,') || contains(format(',{0},', inputs.spikes), ',s3,') || contains(format(',{0},', inputs.spikes), ',s5,') || contains(format(',{0},', inputs.spikes), ',s7,') }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh deploy
      - name: S1 S2 S3 S5 S7 (results from the throwaway D1)
        if: ${{ steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh collect
      - name: Cleanup
        if: ${{ always() }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh cleanup
      - name: Results
        id: results
        if: ${{ always() }}
        continue-on-error: true
        run: bash scripts/ci/provapi-spikes.sh summary
      - name: Remove the token file
        if: ${{ always() }}
        run: rm -f "$TOKEN_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: spike-results
          path: ${{ runner.temp }}/spike-results.json
          if-no-files-found: error
      - name: Every spike passed
        if: ${{ always() }}
        env:
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
        run: test "$RESULTS_OUTCOME" = success

  # Prod: the read-only verify only, from its own GET-only script. No
  # install, no build, no provapi-spikes.sh, no cleanup.
  prod-verify:
    if: ${{ github.ref == 'refs/heads/main' && inputs.env == 'prod' }}
    runs-on: ubuntu-latest
    environment: hosted-prod-deploy
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SPIKES: ${{ inputs.spikes }}
      RUN_ID: ${{ github.run_id }}
      HOSTED_DIR: ${{ github.workspace }}/.github/hosted
    steps:
      # Before the token is written: anything but "verify" is refused.
      - name: Check the inputs
        run: |
          set -euo pipefail
          [ "$SPIKES" = verify ] || { echo "refused: env=prod runs only verify (got: $SPIKES)"; exit 1; }
      - name: Set the paths
        run: |
          set -euo pipefail
          {
            echo "TOKEN_FILE=$RUNNER_TEMP/cf-token"
            echo "RESULTS_DIR=$RUNNER_TEMP/verify-results"
            echo "RESULTS_OUT=$RUNNER_TEMP/verify-results.json"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The one secret: to a 0600 file, masked, never printed.
      - name: Write the Cloudflare token file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "the token secret is not set"; exit 1; }
          printf '::add-mask::%s\n' "$CLOUDFLARE_API_TOKEN"
          umask 077
          printf '%s' "$CLOUDFLARE_API_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          test "$(stat -c %a "$TOKEN_FILE")" = 600
      - name: verify (read-only)
        continue-on-error: true
        run: bash scripts/ci/provapi-token-verify.sh prod verify
      - name: Results
        id: results
        if: ${{ always() }}
        continue-on-error: true
        run: bash scripts/ci/provapi-token-verify.sh prod summary
      - name: Remove the token file
        if: ${{ always() }}
        run: rm -f "$TOKEN_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: prod-verify-results
          path: ${{ runner.temp }}/verify-results.json
          if-no-files-found: error
      - name: Every check passed
        if: ${{ always() }}
        env:
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
        run: test "$RESULTS_OUTCOME" = success
