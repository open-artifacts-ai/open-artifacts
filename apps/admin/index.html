<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- Never white: the theme background from the first byte, same values as --oa-bg. -->
    <style>
      html { background: #eef0f3; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #131518; color-scheme: dark; } }
      html[data-theme="dark"] { background: #131518; color-scheme: dark; }
    </style>
    <title>Open Artifacts Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
